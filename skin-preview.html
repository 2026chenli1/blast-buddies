function drawSkinDeco(x, r, c, t) {
  const d = c && c.deco;
  if (!d) return;
  x.save();
  x.lineJoin = 'round';
  x.lineCap = 'round';
  const OL = Math.max(1.5, r * 0.1); // 粗描边
  const ol = () => { x.strokeStyle = SKIN_OUTLINE; x.lineWidth = OL; x.stroke(); };
  switch (d) {
    case 'cap': { // 军帽：后脑帽冠 + 金色帽徽
      x.fillStyle = c.gun1;
      x.beginPath(); x.ellipse(-r * 0.95, 0, r * 0.55, r * 0.74, 0, 0, TAU); x.fill(); ol();
      x.fillStyle = c.glow;
      x.beginPath(); x.arc(-r * 1.16, 0, r * 0.18, 0, TAU); x.fill(); ol();
      break;
    }
    case 'leaf': { // 双叶：后脑两侧各一片
      x.fillStyle = '#22c55e';
      for (let s = -1; s <= 1; s += 2) {
        x.save();
        x.translate(-r * 0.5, s * r * 0.82);
        x.rotate(s * 0.75);
        x.beginPath(); x.ellipse(0, 0, r * 0.48, r * 0.21, 0, 0, TAU); x.fill(); ol();
        x.restore();
      }
      break;
    }
    case 'bow': { // 蝴蝶结
      x.fillStyle = '#f472b6';
      for (let s = -1; s <= 1; s += 2) {
        x.save();
        x.translate(-r * 0.98, s * r * 0.42);
        x.rotate(s * 0.42);
        x.beginPath(); x.ellipse(0, 0, r * 0.38, r * 0.26, 0, 0, TAU); x.fill(); ol();
        x.restore();
      }
      x.fillStyle = '#fbcfe8';
      x.beginPath(); x.arc(-r * 0.98, 0, r * 0.18, 0, TAU); x.fill(); ol();
      break;
    }
    case 'crown': { // 皇冠：三个尖
      x.fillStyle = '#fcd34d';
      x.beginPath();
      x.moveTo(-r * 0.7, -r * 0.62);
      x.lineTo(-r * 1.3, -r * 0.4);
      x.lineTo(-r * 0.96, -r * 0.06);
      x.lineTo(-r * 1.5, 0);
      x.lineTo(-r * 0.96, r * 0.06);
      x.lineTo(-r * 1.3, r * 0.4);
      x.lineTo(-r * 0.7, r * 0.62);
      x.closePath();
      x.fill(); ol();
      break;
    }
    case 'bolt': { // 闪电
      x.fillStyle = '#fbbf24';
      x.beginPath();
      x.moveTo(-r * 0.6, -r * 0.52);
      x.lineTo(-r * 1.14, -r * 0.52);
      x.lineTo(-r * 0.9, -r * 0.08);
      x.lineTo(-r * 1.42, -r * 0.08);
      x.lineTo(-r * 0.72, r * 0.64);
      x.lineTo(-r * 0.96, r * 0.08);
      x.lineTo(-r * 0.58, r * 0.08);
      x.closePath();
      x.fill(); ol();
      break;
    }
    case 'headband': { // 忍者头带 + 短飘带（不再有盖脸的面罩）
      x.strokeStyle = '#7f1d1d'; x.lineWidth = r * 0.24;
      x.beginPath(); x.arc(0, 0, r * 1.0, Math.PI * 0.68, Math.PI * 1.32); x.stroke();
      x.strokeStyle = SKIN_OUTLINE; x.lineWidth = OL;
      x.beginPath(); x.arc(0, 0, r * 1.0, Math.PI * 0.68, Math.PI * 1.32); x.stroke();
      x.strokeStyle = '#7f1d1d'; x.lineWidth = r * 0.13;
      for (let s = -1; s <= 1; s += 2) {
        const w = Math.sin(t * 3 + (s > 0 ? 0 : 1.2)) * r * 0.1;
        x.beginPath();
        x.moveTo(-r * 0.98, s * r * 0.32);
        x.quadraticCurveTo(-r * 1.28, s * r * 0.46, -r * 1.48, s * r * 0.36 + w);
        x.stroke();
      }
      break;
    }
    case 'flame': { // 三簇火苗
      for (const a of [Math.PI * 0.86, Math.PI, Math.PI * 1.14]) {
        x.save();
        x.rotate(a - Math.PI);
        x.fillStyle = '#f97316';
        x.beginPath();
        x.moveTo(-r * 0.66, -r * 0.3);
        x.quadraticCurveTo(-r * 1.1, -r * 0.32, -r * 1.34, 0);
        x.quadraticCurveTo(-r * 1.1, r * 0.32, -r * 0.66, r * 0.3);
        x.closePath();
        x.fill(); ol();
        x.fillStyle = '#ffd166';
        x.beginPath();
        x.moveTo(-r * 0.7, -r * 0.15);
        x.quadraticCurveTo(-r * 1.0, -r * 0.16, -r * 1.16, 0);
        x.quadraticCurveTo(-r * 1.0, r * 0.16, -r * 0.7, r * 0.15);
        x.closePath();
        x.fill();
        x.restore();
      }
      break;
    }
    case 'icicle': { // 三根冰柱
      for (const a of [Math.PI * 0.84, Math.PI, Math.PI * 1.16]) {
        x.save();
        x.rotate(a - Math.PI);
        x.fillStyle = '#e0f2fe';
        x.beginPath();
        x.moveTo(-r * 0.6, -r * 0.21);
        x.lineTo(-r * 1.44, 0);
        x.lineTo(-r * 0.6, r * 0.21);
        x.closePath();
        x.fill(); ol();
        x.restore();
      }
      break;
    }
    case 'mecha': { // 机甲头盔：一整块深色盔壳 + 一道高对比红鳍（只有两个实心块，小图不糊）
      x.fillStyle = c.gun2;
      x.beginPath(); x.ellipse(-r * 0.7, 0, r * 0.64, r * 0.8, 0, 0, TAU); x.fill(); ol();
      x.fillStyle = '#fb7185';
      x.beginPath();
      x.moveTo(-r * 0.6, -r * 0.62);
      x.lineTo(-r * 1.2, -r * 0.3);
      x.lineTo(-r * 1.18, -r * 0.95);
      x.closePath();
      x.fill(); ol();
      break;
    }
    case 'horn': { // 独角（朝前）+ 3 团拉开间距的高对比鬃毛（三色，不挤在一起）
      const cols = ['#ff6b6b', '#ffd166', '#67e8f9'];
      for (let i = 0; i < 3; i++) {
        const a = Math.PI * (0.58 + i * 0.3);
        const rr = r * (i === 1 ? 1.1 : 1);
        x.fillStyle = cols[i];
        x.save();
        x.translate(Math.cos(a) * rr, Math.sin(a) * rr);
        x.rotate(a);
        x.beginPath(); x.ellipse(0, 0, r * 0.44, r * 0.34, 0, 0, TAU); x.fill(); ol();
        x.restore();
      }
      const g = x.createLinearGradient(r * 0.6, 0, r * 1.42, 0);
      g.addColorStop(0, '#fde68a'); g.addColorStop(1, '#f9a8d4');
      x.fillStyle = g;
      x.beginPath();
      x.moveTo(r * 0.6, -r * 0.3); x.lineTo(r * 1.42, 0); x.lineTo(r * 0.6, r * 0.3);
      x.closePath();
      x.fill(); ol();
      break;
    }
    case 'void': { // 虚空之眼：后脑一整块暗色裂口 + 中心亮紫核心（两个大色块）
      x.fillStyle = c.gun2;
      x.beginPath(); x.ellipse(-r * 0.72, 0, r * 0.66, r * 0.78, 0, 0, TAU); x.fill(); ol();
      x.fillStyle = c.glow;
      x.beginPath(); x.ellipse(-r * 0.86, 0, r * 0.3, r * 0.36, 0, 0, TAU); x.fill();
      break;
    }
    case 'crimson': { // 裁决之刃：后脑一把实心血红弯刀（单个大三角）
      x.fillStyle = c.gun1;
      x.beginPath();
      x.moveTo(-r * 0.35, -r * 0.5);
      x.lineTo(-r * 1.42, -r * 0.12);
      x.lineTo(-r * 0.55, r * 0.62);
      x.closePath();
      x.fill(); ol();
      break;
    }
    case 'astral': { // 星辰之环：后脑一圈金色粗环 + 顶部一颗四角星（两个大符号）
      x.strokeStyle = c.glow; x.lineWidth = Math.max(2, r * 0.16);
      x.beginPath(); x.arc(-r * 0.78, 0, r * 0.52, 0, TAU); x.stroke();
      x.strokeStyle = SKIN_OUTLINE; x.lineWidth = Math.max(1.2, r * 0.06);
      x.beginPath(); x.arc(-r * 0.78, 0, r * 0.6, 0, TAU); x.stroke();
      x.beginPath(); x.arc(-r * 0.78, 0, r * 0.44, 0, TAU); x.stroke();
      x.fillStyle = c.glow; // 四角星
      const sx = -r * 0.78, sy = -r * 0.86, ss = r * 0.34;
      x.beginPath();
      x.moveTo(sx, sy - ss); x.lineTo(sx + ss * 0.32, sy - ss * 0.32);
      x.lineTo(sx + ss, sy); x.lineTo(sx + ss * 0.32, sy + ss * 0.32);
      x.lineTo(sx, sy + ss); x.lineTo(sx - ss * 0.32, sy + ss * 0.32);
      x.lineTo(sx - ss, sy); x.lineTo(sx - ss * 0.32, sy - ss * 0.32);
      x.closePath();
      x.fill(); ol();
      break;
    }
  }
  x.restore();
}

function drawSkinMark(x, r, c, t) {
  const tex = c && c.texture;
  if (!tex || tex === 'clean') return;
  const A0 = x.globalAlpha;
  x.save();
  x.beginPath();
  x.arc(0, 0, r * 0.97, 0, TAU);
  x.clip();
  switch (tex) {
    case 'camo': { // 翠绿战士：迷彩斑块 + 迷彩弧线
      x.fillStyle = c.gun1;
      const spots = [[-0.34, -0.30, 0.30, 0.20, 0.6], [0.10, 0.12, 0.34, 0.22, -0.4],
                     [-0.05, 0.44, 0.26, 0.16, 0.2], [0.36, -0.34, 0.22, 0.15, -0.7],
                     [-0.44, 0.06, 0.20, 0.13, 0.9]];
      for (const s of spots) {
        x.globalAlpha = A0 * 0.42;
        x.beginPath();
        x.ellipse(s[0] * r, s[1] * r, s[2] * r, s[3] * r, s[4], 0, TAU);
        x.fill();
      }
      x.globalAlpha = A0 * 0.2;
      x.strokeStyle = c.gun2; x.lineWidth = Math.max(1, r * 0.04);
      for (let i = -1; i <= 1; i++) {
        x.beginPath();
        x.ellipse(0, 0, r * (0.52 + i * 0.18), r * 0.84, 0.35, 0, TAU);
        x.stroke();
      }
      break;
    }
    case 'petal': { // 樱花甜心：樱花印记
      const fl = [[-0.32, -0.24, 0.21], [0.08, 0.30, 0.17], [0.30, -0.36, 0.14]];
      for (const f of fl) {
        x.globalAlpha = A0 * 0.5;
        x.fillStyle = '#fff1f7';
        for (let i = 0; i < 5; i++) {
          const ang = i * TAU / 5 + 0.2;
          x.beginPath();
          x.ellipse(f[0] * r + Math.cos(ang) * f[2] * r * 0.6,
                    f[1] * r + Math.sin(ang) * f[2] * r * 0.6,
                    f[2] * r * 0.5, f[2] * r * 0.3, ang, 0, TAU);
          x.fill();
        }
        x.globalAlpha = A0 * 0.8;
        x.fillStyle = '#fde68a';
        x.beginPath(); x.arc(f[0] * r, f[1] * r, f[2] * r * 0.22, 0, TAU); x.fill();
      }
      break;
    }
    case 'shine': { // 黄金武士：金属反光条 + 鱼鳞纹
      x.globalAlpha = A0 * 0.5;
      x.strokeStyle = '#fffbeb'; x.lineWidth = r * 0.1;
      x.beginPath();
      x.moveTo(-r * 0.8, -r * 0.15); x.quadraticCurveTo(0, -r * 0.5, r * 0.8, -r * 0.1);
      x.stroke();
      x.globalAlpha = A0 * 0.3; x.lineWidth = r * 0.05;
      x.beginPath();
      x.moveTo(-r * 0.75, r * 0.25); x.quadraticCurveTo(0, r * 0.05, r * 0.78, r * 0.3);
      x.stroke();
      x.globalAlpha = A0 * 0.26;
      x.strokeStyle = c.gun2; x.lineWidth = Math.max(1, r * 0.035);
      for (let i = 0; i < 5; i++) {
        x.beginPath();
        x.arc(-r * 0.1, -r * 0.75 + i * r * 0.38, r * 0.3, Math.PI * 0.15, Math.PI * 0.85);
        x.stroke();
      }
      break;
    }
    case 'vein': { // 紫电幻影：电脉纹路（随时间明暗）
      x.strokeStyle = c.glow; x.lineWidth = Math.max(2, r * 0.1);
      x.globalAlpha = A0 * (0.45 + 0.25 * Math.abs(Math.sin(t * 3)));
      const veins = [[-0.7, -0.3, -0.2, -0.5, 0.3, -0.2],
                     [-0.6, 0.35, 0.1, 0.1, 0.65, 0.4],
                     [0.2, -0.6, 0.5, -0.2, 0.35, 0.35]];
      for (const v of veins) {
        x.beginPath();
        x.moveTo(v[0] * r, v[1] * r);
        x.lineTo(v[2] * r, v[3] * r);
        x.lineTo(v[4] * r, v[5] * r);
        x.stroke();
      }
      break;
    }
    case 'weave': { // 暗夜行者：忍者布纹（细密交叉织纹）
      x.strokeStyle = c.gun1; x.lineWidth = Math.max(1, r * 0.03);
      x.globalAlpha = A0 * 0.28;
      for (let i = -4; i <= 4; i++) {
        const off = i * r * 0.26;
        x.beginPath();
        x.moveTo(-r, off - r * 0.5); x.lineTo(r, off + r * 0.5);
        x.stroke();
      }
      x.globalAlpha = A0 * 0.2; x.strokeStyle = c.glow;
      for (let i = -4; i <= 4; i++) {
        const off = i * r * 0.26;
        x.beginPath();
        x.moveTo(-r, off + r * 0.5); x.lineTo(r, off - r * 0.5);
        x.stroke();
      }
      x.globalAlpha = A0 * 0.45;
      x.strokeStyle = c.gun1; x.lineWidth = Math.max(1, r * 0.06);
      x.beginPath(); x.arc(0, 0, r * 0.66, 0, TAU); x.stroke();
      break;
    }
    case 'stripe': { // 烈焰战神：火焰条纹 + 火星点
      const cols = ['#ffd166', '#f97316', '#fb923c'];
      for (let i = 0; i < 3; i++) {
        x.globalAlpha = A0 * 0.4;
        x.strokeStyle = cols[i];
        x.lineWidth = r * (0.14 - i * 0.03);
        const yy = -r * 0.45 + i * r * 0.45;
        x.beginPath();
        x.moveTo(-r * 0.85, yy);
        x.quadraticCurveTo(-r * 0.2, yy - r * 0.22 + Math.sin(t * 4 + i) * r * 0.05, r * 0.5, yy + r * 0.1);
        x.stroke();
      }
      x.globalAlpha = A0 * 0.35;
      x.fillStyle = '#fff7ed';
      for (let i = 0; i < 4; i++) {
        x.beginPath();
        x.arc(-r * 0.5 + i * r * 0.34, r * (0.5 + 0.2 * Math.sin(t * 5 + i * 2)), r * 0.05, 0, TAU);
        x.fill();
      }
      break;
    }
    case 'crack': { // 寒冰射手：冰裂纹 + 霜点
      x.globalAlpha = A0 * 0.55;
      x.strokeStyle = '#e0f2fe'; x.lineWidth = Math.max(2, r * 0.085);
      const cracks = [[-0.2, -0.75, -0.35, -0.2, -0.75, 0.15],
                      [0.15, 0.7, 0.45, 0.2, 0.8, -0.15],
                      [-0.6, 0.5, -0.1, 0.35, 0.25, 0.6]];
      for (const cr of cracks) {
        x.beginPath();
        x.moveTo(cr[0] * r, cr[1] * r);
        x.lineTo(cr[2] * r, cr[3] * r);
        x.lineTo(cr[4] * r, cr[5] * r);
        x.stroke();
      }
      x.globalAlpha = A0 * 0.5;
      x.fillStyle = '#f0fdff';
      for (let i = 0; i < 6; i++) {
        const ang = i * TAU / 6 + 0.4;
        x.beginPath();
        x.arc(Math.cos(ang) * r * 0.55, Math.sin(ang) * r * 0.55, r * 0.09, 0, TAU);
        x.fill();
      }
      break;
    }
    case 'metal': { // 机甲武装：大块装甲斜分 + 顶部高光（只有两块色，不用板缝铆钉）
      x.globalAlpha = A0 * 0.5;
      x.fillStyle = c.gun1;
      x.beginPath();
      x.moveTo(-r, -r * 0.15); x.lineTo(-r, r); x.lineTo(r, r); x.lineTo(r, r * 0.3);
      x.closePath();
      x.fill();
      x.globalAlpha = A0 * 0.25;
      x.fillStyle = c.glow;
      x.beginPath();
      x.moveTo(-r, -r); x.lineTo(r, -r); x.lineTo(r * 0.2, -r * 0.5); x.lineTo(-r, -r * 0.25);
      x.closePath();
      x.fill();
      break;
    }
    case 'shimmer': { // 彩虹独角兽：3 道粗彩虹横带（不再叠 5 层细线）
      const cols = ['#ff6b6b', '#ffd166', '#67e8f9'];
      x.globalAlpha = A0 * 0.32;
      for (let i = 0; i < 3; i++) {
        x.fillStyle = cols[i];
        x.fillRect(-r, -r * 0.85 + i * r * 0.55, r * 2, r * 0.42);
      }
      break;
    }
    case 'void': { // 虚空行者：一整块暗色虚空 + 2 颗亮紫星点
      x.globalAlpha = A0 * 0.6;
      x.fillStyle = c.gun2;
      x.beginPath(); x.ellipse(-r * 0.3, r * 0.05, r * 0.7, r * 0.85, 0, 0, TAU); x.fill();
      x.globalAlpha = A0 * 0.9;
      x.fillStyle = c.glow;
      x.beginPath(); x.arc(r * 0.25, -r * 0.4, r * 0.13, 0, TAU); x.fill();
      x.beginPath(); x.arc(-r * 0.42, r * 0.5, r * 0.1, 0, TAU); x.fill();
      break;
    }
    case 'crimson': { // 猩红裁决：两道粗深红斜纹
      x.globalAlpha = A0 * 0.5;
      x.fillStyle = c.gun1;
      for (let i = 0; i < 2; i++) {
        const ox = -r * 0.75 + i * r * 0.85;
        x.beginPath();
        x.moveTo(ox, -r); x.lineTo(ox + r * 0.42, -r); x.lineTo(ox + r * 0.16, r); x.lineTo(ox - r * 0.26, r);
        x.closePath(); x.fill();
      }
      break;
    }
    case 'astral': { // 星辰主宰：深蓝夜幕 + 3 颗金色大星点
      x.globalAlpha = A0 * 0.55;
      x.fillStyle = c.gun2;
      x.beginPath(); x.ellipse(0, r * 0.15, r, r * 0.75, 0, 0, TAU); x.fill();
      x.globalAlpha = A0 * 0.95;
      x.fillStyle = c.glow;
      const pts = [[-r * 0.35, -r * 0.42, 0.13], [r * 0.3, -r * 0.2, 0.11], [-r * 0.1, -r * 0.66, 0.09]];
      for (const [px, py, pr] of pts) { x.beginPath(); x.arc(px, py, r * pr, 0, TAU); x.fill(); }
      break;
    }
  }
  x.restore();
}

function drawSkinEyes(x, r, c, bob) {
  const style = (c && c.eye) || 'normal';
  const ex = r * 0.34, ey = r * 0.3, by = (bob || 0) * 0.3;
  const DARK = '#0d1b2a';
  if (style === 'glow') { // 虚空之眼：纯发光实心眼，无瞳孔
    x.fillStyle = c.glow;
    for (let s = -1; s <= 1; s += 2) {
      x.beginPath(); x.arc(ex, s * ey + by, r * 0.15, 0, TAU); x.fill();
    }
    return;
  }
  if (style === 'narrow') { // 眯眼：一条斜横杠
    x.strokeStyle = DARK; x.lineWidth = Math.max(1.8, r * 0.13); x.lineCap = 'round';
    for (let s = -1; s <= 1; s += 2) {
      x.beginPath();
      x.moveTo(ex - r * 0.13, s * ey + by);
      x.lineTo(ex + r * 0.15, s * (ey - r * 0.06) + by);
      x.stroke();
    }
    return;
  }
  if (style === 'star') { // 星星眼
    x.fillStyle = DARK;
    for (let s = -1; s <= 1; s += 2) {
      const cy = s * ey + by;
      x.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4 - Math.PI / 2;
        const rr = (i % 2 === 0) ? r * 0.15 : r * 0.065;
        const px = ex + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
      }
      x.closePath(); x.fill();
    }
    return;
  }
  // normal / visor 都先画眼珠
  x.fillStyle = DARK;
  x.beginPath();
  x.arc(ex, -ey + by, r * 0.13, 0, TAU);
  x.arc(ex, ey + by, r * 0.13, 0, TAU);
  x.fill();
  if (style === 'visor') { // 机甲：外面套一个发光目镜框（不遮眼珠）
    x.strokeStyle = c.visorCol || c.glow; x.lineWidth = Math.max(1.4, r * 0.09);
    x.beginPath();
    x.roundRect(ex - r * 0.22, -ey - r * 0.22 + by, r * 0.46, r * 0.44, r * 0.12);
    x.stroke();
    return;
  }
  x.fillStyle = '#fff'; // 高光点
  x.beginPath();
  x.arc(ex + r * 0.045, -ey - r * 0.045 + by, r * 0.05, 0, TAU);
  x.arc(ex + r * 0.045, ey - r * 0.045 + by, r * 0.05, 0, TAU);
  x.fill();
}
function render(cv,id,size){
  const dpr=2; cv.width=size*dpr; cv.height=size*dpr; cv.style.width=size+'px'; cv.style.height=size+'px';
  const x=cv.getContext('2d'); x.scale(dpr,dpr);
  const d=SKIN_DEFS[id], r=size*0.32;
  x.save(); x.translate(size/2,size/2); x.rotate(-Math.PI/2);
  drawSkinDeco(x,r,d,0);
  const g=x.createLinearGradient(-r,-r,r,r); g.addColorStop(0,d.body1); g.addColorStop(1,d.body2);
  x.beginPath(); x.arc(0,0,r,0,TAU); x.fillStyle=g; x.fill();
  drawSkinMark(x,r,d,0);
  x.strokeStyle='rgba(0,0,0,.25)'; x.lineWidth=2; x.stroke(); x.restore();
  x.save(); x.translate(size/2,size/2); x.rotate(-Math.PI/2); drawSkinEyes(x,r,d,0); x.restore();
}
const TIPS={

};

   '<td>'+d.skill.desc+'<div class="tag">'+TIPS[id]+'</div></td></tr>';
  prev=d.price; prevPw=d.skill.power;
}
for(const [boxId,size] of [['shop',72],['game',44]]){
  const box=document.getElementById(boxId);
  for(const id of Object.keys(SKIN_DEFS)){
    const d=SKIN_DEFS[id];
