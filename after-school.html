<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>金小助 · 学习助手</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1b2a; --bg2: #14263c;
    --card: rgba(255,255,255,.06); --border: rgba(255,255,255,.12);
    --text: #eef4ff; --muted: #9fb3c8;
    --accent: #ffd166; --accent2: #ffb703;
    --cyan: #4cc9f0; --green: #2ec4b6; --red: #ff6b6b;
    --pink: #ff6b9d;
  }
  html, body {
    width: 100%; min-height: 100%;
    background: radial-gradient(ellipse at 20% 0%, #1b3350 0%, var(--bg) 55%);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    color: var(--text); -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font-family: inherit; }
  button { cursor: pointer; }
  svg { display: block; }

  /* ============ 登录 / 注册 ============ */
  #auth-view {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; overflow-y: auto;
  }
  .auth-card {
    width: min(420px, 94vw);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border: 1px solid var(--border); border-radius: 20px;
    padding: 34px 28px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45); backdrop-filter: blur(6px);
  }
  .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
  .brand-icon {
    width: 62px; height: 62px; border-radius: 18px;
    background: linear-gradient(145deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(255,183,3,.35); margin-bottom: 14px;
  }
  .brand-title {
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd166, #4cc9f0, #2ec4b6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .auth-tab {
    flex: 1; padding: 11px 0; font-size: 15px; font-weight: 800;
    color: var(--muted); background: rgba(255,255,255,.05);
    border: 1px solid var(--border); border-radius: 12px; transition: all .15s ease;
  }
  .auth-tab.active {
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    color: var(--bg); border-color: var(--accent2); box-shadow: 0 4px 16px rgba(255,183,3,.3);
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
  .field input {
    width: 100%; padding: 12px 14px; background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.18); border-radius: 10px;
    color: var(--text); font-size: 15px; outline: none; transition: border-color .15s ease;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: #5f7690; }
  .auth-msg { font-size: 13px; min-height: 18px; margin: 4px 0 10px; line-height: 1.5; }
  .auth-msg.err { color: var(--red); }
  .auth-msg.ok { color: var(--green); }
  .btn-primary {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 800; letter-spacing: 1px;
    color: var(--bg); background: linear-gradient(180deg, var(--accent), var(--accent2));
    border: none; border-radius: 999px;
    box-shadow: 0 5px 0 #d89b00, 0 10px 22px rgba(255,183,3,.3);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #d89b00, 0 14px 28px rgba(255,183,3,.4); }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #d89b00; }
  .auth-hint { text-align: center; font-size: 12px; color: #6c8399; margin-top: 18px; line-height: 1.6; }

  /* ============ 主应用 ============ */
  #app-view { display: none; min-height: 100vh; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; flex: none;
    background: linear-gradient(180deg, #12243a, #0c1928);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 22px 14px;
    position: sticky; top: 0; height: 100vh;
  }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
  .side-brand .brand-icon { width: 40px; height: 40px; border-radius: 12px; margin: 0; }
  .side-brand .brand-icon svg { width: 22px; height: 22px; }
  .side-brand-name { font-size: 17px; font-weight: 900; letter-spacing: 1px; }
  .user-chip {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 24px;
  }
  .avatar {
    width: 36px; height: 36px; flex: none; border-radius: 50%;
    background: linear-gradient(145deg, var(--cyan), var(--green));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; color: var(--bg);
  }
  .user-name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-label { font-size: 11px; color: var(--muted); }
  .side-title { font-size: 11px; color: #6c8399; padding: 0 10px; margin-bottom: 10px; letter-spacing: 1px; font-weight: 700; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 12px; margin-bottom: 6px;
    background: transparent; border: 1px solid transparent; border-radius: 12px;
    color: var(--muted); font-size: 15px; font-weight: 700; text-align: left; transition: all .15s ease;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .nav-item.active { background: rgba(255,209,102,.12); border-color: rgba(255,209,102,.4); color: var(--accent); }
  .nav-item .ico { width: 22px; height: 22px; flex: none; }
  .side-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
  .logout-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px;
    background: rgba(255,107,107,.08); border: 1px solid rgba(255,107,107,.25);
    border-radius: 12px; color: #ff9b9b; font-size: 14px; font-weight: 700;
  }
  .logout-btn:hover { background: rgba(255,107,107,.16); }

  .main { flex: 1; min-width: 0; padding: 34px clamp(18px, 4vw, 52px); }
  .welcome { margin-bottom: 28px; }
  .welcome h1 { font-size: clamp(24px, 3.5vw, 34px); font-weight: 900; letter-spacing: 1px; }
  .welcome p { color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.6; }
  .welcome b { color: var(--accent); }
  /* AI 学习智能体卡 */
  .agent-card {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 20px 22px; margin-bottom: 24px;
    background: linear-gradient(110deg, rgba(76,201,240,.13), rgba(46,196,182,.06));
    border: 1px solid rgba(76,201,240,.3); border-radius: 18px;
  }
  .agent-avatar {
    width: 56px; height: 56px; flex: none; border-radius: 16px;
    background: linear-gradient(145deg, #4cc9f0, #2ec4b6);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(76,201,240,.3);
  }
  .agent-info { flex: 1; min-width: 200px; }
  .agent-info .an { font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  .agent-info .online { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2ec4b6; box-shadow: 0 0 0 3px rgba(46,196,182,.2); }
  .agent-info .ad { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.6; }

  /* 首页快捷入口 */
  .quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .quick-card {
    text-align: left; padding: 24px 20px; background: var(--card);
    border: 1px solid var(--border); border-radius: 18px; color: var(--text);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .quick-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.3); box-shadow: 0 14px 30px rgba(0,0,0,.3); }
  .quick-card .panel-ico { margin-bottom: 16px; width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .quick-card h3 { font-size: 18px; font-weight: 800; }
  .quick-card p { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  /* 通用面板 */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px;
  }
  .section-title { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
  .section-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .form-row input, .form-row textarea, .form-row select {
    width: 100%; padding: 11px 12px; background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.18); border-radius: 10px;
    color: var(--text); font-size: 14px; outline: none; resize: vertical;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--accent); }
  .form-row select option { background: var(--bg2); color: var(--text); }
  .btn {
    padding: 11px 20px; font-size: 14px; font-weight: 800;
    border-radius: 10px; border: 1px solid var(--border);
    background: rgba(255,255,255,.08); color: var(--text); transition: all .15s ease;
  }
  .btn:hover { background: rgba(255,255,255,.15); }
  .btn.gold { background: linear-gradient(180deg, var(--accent), var(--accent2)); color: var(--bg); border-color: var(--accent2); }
  .btn.gold:hover { filter: brightness(1.08); }
  .btn.sm { padding: 7px 13px; font-size: 12px; border-radius: 8px; }
  .btn.danger { color: #ff9b9b; border-color: rgba(255,107,107,.3); background: rgba(255,107,107,.08); }
  .btn.danger:hover { background: rgba(255,107,107,.16); }
  .btn.green { color: #7ee0c0; border-color: rgba(46,196,182,.35); background: rgba(46,196,182,.1); }
  .btn.green:hover { background: rgba(46,196,182,.2); }
  .inline-msg { font-size: 13px; min-height: 18px; margin-top: 8px; }
  .inline-msg.err { color: var(--red); }
  .inline-msg.ok { color: var(--green); }

  /* 错题列表 */
  .q-list { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
  .q-item {
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px;
  }
  .q-item.mastered { border-color: rgba(46,196,182,.4); background: rgba(46,196,182,.06); }
  .q-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .subj-tag { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
  .subj-chinese { background: rgba(255,107,157,.16); color: var(--pink); }
  .subj-math { background: rgba(76,201,240,.16); color: var(--cyan); }
  .subj-english { background: rgba(46,196,182,.16); color: var(--green); }
  .master-tag { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(46,196,182,.18); color: #7ee0c0; }
  .q-actions { margin-left: auto; display: flex; gap: 8px; }
  .q-text { font-size: 15px; font-weight: 600; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .q-ans { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .q-ans b { color: #7ee0c0; }
  .empty {
    text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; line-height: 1.8;
    border: 1px dashed var(--border); border-radius: 14px; margin-top: 20px;
  }

  /* 拍照 / OCR / AI */
  .capture-zone {
    border: 2px dashed rgba(255,209,102,.4); border-radius: 16px;
    padding: 34px 20px; text-align: center; cursor: pointer;
    background: rgba(255,209,102,.04); transition: all .15s ease;
  }
  .capture-zone:hover { background: rgba(255,209,102,.09); border-color: var(--accent); }
  .capture-zone .cam-ico { margin: 0 auto 14px; width: 56px; height: 56px; border-radius: 16px; background: rgba(255,209,102,.15); display: flex; align-items: center; justify-content: center; }
  .capture-zone h3 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
  .capture-zone p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .capture-zone input[type=file] { display: none; }
  .preview-img { max-width: 100%; max-height: 260px; border-radius: 12px; display: block; margin: 14px auto; border: 1px solid var(--border); }
  /* 拍照裁剪 */
  .crop-wrap { position: relative; display: inline-block; max-width: 100%; margin: 14px auto; border-radius: 12px; overflow: hidden; line-height: 0; touch-action: none; border: 1px solid var(--border); }
  .crop-wrap img { display: block; max-width: 100%; max-height: 320px; }
  .crop-mask { position: absolute; inset: 0; background: rgba(6,14,24,.55); pointer-events: none; }
  .crop-box { position: absolute; border: 2px dashed var(--accent); background: rgba(255,209,102,.08); box-shadow: 0 0 0 9999px rgba(6,14,24,.5); pointer-events: none; }
  .crop-handle { position: absolute; width: 16px; height: 16px; background: var(--accent); border: 2px solid var(--bg); border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%); }
  .crop-hint { text-align: center; font-size: 12px; color: var(--muted); margin: 6px 0 12px; line-height: 1.6; }
  .crop-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
  .progress-box { margin: 14px 0; }
  .progress-bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); width: 0%; transition: width .2s ease; border-radius: 999px; }
  .progress-label { font-size: 13px; color: var(--muted); }
  .result-box { background: rgba(46,196,182,.08); border: 1px solid rgba(46,196,182,.28); border-radius: 12px; padding: 16px; margin-top: 14px; }
  .result-box .lbl { font-size: 12px; font-weight: 800; color: #7ee0c0; margin-bottom: 6px; letter-spacing: .5px; }
  .result-box .val { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .ocr-edit { width: 100%; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; color: var(--text); font-size: 14px; padding: 10px 12px; outline: none; resize: vertical; }
  .ocr-edit:focus { border-color: var(--accent); }
  .q-thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); flex: none; cursor: pointer; }

  /* AI 问答对话 */
  .chat-wrap { max-width: 760px; }
  .chat-select-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .chat-select-row select { flex: 1; min-width: 200px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; color: var(--text); font-size: 14px; padding: 11px 12px; outline: none; }
  /* 聊天：固定高度的消息区 + 固定在下方的输入区（滚动消息时输入框不动） */
  .chat-shell { display: flex; flex-direction: column; height: min(58vh, 560px); min-height: 360px; }
  .chat-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 4px; margin: 0; scroll-behavior: smooth; }
  .msg { max-width: 88%; padding: 13px 16px; border-radius: 14px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.me { align-self: flex-end; background: linear-gradient(145deg, #ffd166, #ffb703); color: var(--bg); border-bottom-right-radius: 4px; font-weight: 600; }
  .msg.ai { align-self: flex-start; background: rgba(76,201,240,.1); border: 1px solid rgba(76,201,240,.28); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .chat-dock { flex: none; border-top: 1px solid var(--border); padding-top: 14px; background: var(--card); }
  .chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
  .chat-input-row textarea { flex: 1; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; color: var(--text); font-size: 14px; padding: 12px; outline: none; resize: none; min-height: 48px; max-height: 120px; }
  .chat-input-row textarea:focus { border-color: var(--accent); }
  .quick-ask { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .quick-ask button { font-size: 12px; padding: 7px 13px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--border); color: var(--muted); transition: all .12s ease; }
  .quick-ask button:hover { color: var(--accent); border-color: rgba(255,209,102,.4); }
  .quick-ask button.active { color: var(--bg); background: linear-gradient(145deg, #ffd166, #ffb703); border-color: var(--accent2); font-weight: 800; }
  /* 固定在对话上方的讲解卡 */
  .chat-spotlight { flex: none; margin: 0 0 12px; border: 1px solid rgba(255,209,102,.35); background: rgba(255,209,102,.07); border-radius: 12px; padding: 12px 14px; max-height: 170px; overflow-y: auto; }
  .chat-spotlight .sp-h { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
  .chat-spotlight .sp-h button { background: none; border: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 2px; }
  .chat-spotlight .sp-b { font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .thinking { color: var(--muted); font-size: 13px; }
  .thinking::after { content: ''; animation: dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'} }

  /* 弹窗（复习提醒 / 首次设置 / 加入错题集确认） */
  .modal-mask {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(4,10,18,.72); backdrop-filter: blur(4px);
  }
  .modal-mask.hidden { display: none; }
  .modal-box {
    width: min(440px, 94vw); max-height: 86vh; overflow-y: auto;
    background: linear-gradient(180deg, #16283f, #0e1c2d);
    border: 1px solid rgba(255,255,255,.16); border-radius: 18px;
    padding: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.6);
  }
  .modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .modal-head .mi { width: 38px; height: 38px; flex: none; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: rgba(255,209,102,.15); }
  .modal-title { font-size: 19px; font-weight: 900; }
  .modal-desc { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 8px 0 18px; }
  .modal-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .modal-btns .btn { flex: 1; min-width: 110px; }
  .freq-opts { display: flex; flex-direction: column; gap: 9px; }
  .freq-opt {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 12px 14px; text-align: left;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 14px; font-weight: 700;
    transition: all .15s ease;
  }
  .freq-opt:hover { background: rgba(255,255,255,.1); }
  .freq-opt.active { background: rgba(255,209,102,.13); border-color: rgba(255,209,102,.5); color: var(--accent); }
  .freq-opt .radio { width: 17px; height: 17px; flex: none; border-radius: 50%; border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center; }
  .freq-opt.active .radio { border-color: var(--accent); }
  .freq-opt.active .radio::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .freq-opt small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; margin-top: 2px; }
  .review-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
  .review-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 10px;
  }
  .review-row .rt { flex: 1; font-size: 13px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .review-row .rd { font-size: 11px; color: var(--accent); flex: none; }
  .subject-picker { display: flex; gap: 8px; margin-top: 6px; }
  .subject-picker button {
    flex: 1; padding: 10px 0; font-size: 14px; font-weight: 800;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    border-radius: 10px; color: var(--muted);
  }
  .subject-picker button.active { color: var(--accent); border-color: rgba(255,209,102,.5); background: rgba(255,209,102,.13); }

  /* 首页复习提示卡 */
  .review-banner {
    display: flex; align-items: center; gap: 14px; margin-bottom: 24px;
    padding: 16px 18px; border-radius: 14px;
    background: linear-gradient(100deg, rgba(255,209,102,.14), rgba(255,209,102,.05));
    border: 1px solid rgba(255,209,102,.32);
  }
  .review-banner .rb-ico { width: 42px; height: 42px; flex: none; border-radius: 11px; background: rgba(255,209,102,.16); display: flex; align-items: center; justify-content: center; }
  .review-banner .rb-txt { flex: 1; }
  .review-banner .rb-txt b { font-size: 15px; color: var(--accent); }
  .review-banner .rb-txt p { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* 错题科目筛选 */
  .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 4px; }
  .filter-tab {
    padding: 8px 16px; font-size: 13px; font-weight: 800;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    border-radius: 999px; color: var(--muted); transition: all .15s ease;
  }
  .filter-tab:hover { color: var(--text); }
  .filter-tab.active { background: rgba(255,209,102,.14); border-color: rgba(255,209,102,.45); color: var(--accent); }

  /* 复习测试 & 学习数据 */
  .view-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .view-tab { padding: 9px 18px; font-size: 14px; font-weight: 800; border-radius: 10px; background: transparent; border: 1px solid transparent; color: var(--muted); }
  .view-tab:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .view-tab.active { background: rgba(255,209,102,.13); border-color: rgba(255,209,102,.4); color: var(--accent); }
  .test-card { max-width: 760px; }
  .test-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
  .test-progress .bar { flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
  .test-progress .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 999px; transition: width .3s ease; }
  .test-q { font-size: clamp(17px, 2.5vw, 22px); font-weight: 700; line-height: 1.7; margin: 20px 0; white-space: pre-wrap; word-break: break-word; }
  .test-input {
    width: 100%; min-height: 90px; padding: 14px; background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.18); border-radius: 12px; color: var(--text);
    font-size: 14px; line-height: 1.6; outline: none; resize: vertical;
  }
  .test-input:focus { border-color: var(--accent); }
  .grade-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .grade-btn { flex: 1; min-width: 140px; padding: 15px; font-size: 15px; font-weight: 800; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text); }
  .grade-btn.got { background: rgba(46,196,182,.15); border-color: rgba(46,196,182,.45); color: #7ee0c0; }
  .grade-btn.miss { background: rgba(255,107,107,.12); border-color: rgba(255,107,107,.4); color: #ff9b9b; }
  .grade-btn:hover { filter: brightness(1.15); }
  .test-done { text-align: center; padding: 36px 20px; }
  .test-done .big { font-size: 46px; font-weight: 900; color: var(--accent); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 18px 0; }
  .stat-box { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
  .stat-box .n { font-size: 28px; font-weight: 900; color: var(--accent); }
  .stat-box .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .trend-bars { display: flex; align-items: flex-end; gap: 6px; height: 110px; margin-top: 10px; }
  .trend-bars .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .trend-bars .col .b { width: 100%; max-width: 34px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--cyan), var(--green)); min-height: 3px; }
  .trend-bars .col .d { font-size: 10px; color: var(--muted); white-space: nowrap; }

  /* 问答 */
  .quiz-card { max-width: 720px; }
  .quiz-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
  .quiz-q { font-size: 20px; font-weight: 700; line-height: 1.7; margin: 18px 0 26px; white-space: pre-wrap; word-break: break-word; }
  .quiz-answer {
    background: rgba(46,196,182,.1); border: 1px solid rgba(46,196,182,.3);
    border-radius: 12px; padding: 16px; margin-bottom: 22px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  }
  .quiz-answer b { color: #7ee0c0; }
  .quiz-btns { display: flex; gap: 12px; flex-wrap: wrap; }

  /* 效果图雷达图 */
  .chart-wrap { display: grid; grid-template-columns: minmax(300px, 1.2fr) minmax(220px, .8fr); gap: 20px; align-items: start; }
  .chart-box { display: flex; align-items: center; justify-content: center; min-height: 360px; }
  .chart-box svg { width: 100%; max-width: 420px; height: auto; }
  .stat-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-name { display: flex; align-items: center; gap: 9px; font-weight: 700; }
  .stat-dot { width: 10px; height: 10px; border-radius: 50%; }
  .stat-num { color: var(--muted); font-size: 13px; }
  .stat-num b { color: var(--text); font-size: 16px; }
  .score-big { font-size: 30px; font-weight: 900; }

  .mobile-top { display: none; }
  @media (max-width: 720px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 40;
      transform: translateX(-100%); transition: transform .22s ease;
      width: 250px; box-shadow: 8px 0 30px rgba(0,0,0,.5);
    }
    .sidebar.open { transform: translateX(0); }
    .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 35; }
    .scrim.show { display: block; }
    .mobile-top {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      background: linear-gradient(180deg, #12243a, #0c1928);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
    }
    .menu-btn {
      width: 40px; height: 40px; flex: none; background: rgba(255,255,255,.06);
      border: 1px solid var(--border); border-radius: 10px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
    }
    .mobile-top .mt-title { font-size: 16px; font-weight: 900; }
    .main { padding: 24px 16px; }
    .chart-wrap { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="auth-card">

        </svg>
      </div>

      <div class="brand-sub">你的课后学习小助手</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" type="button">登录</button>

    <form id="auth-form" autocomplete="off">
      <div class="field">

      </div>
      <div class="field" id="confirm-field" style="display:none;">
        <label for="confirm-input">确认密码</label>
        <input id="confirm-input" type="password" placeholder="再输入一次密码" maxlength="40">
      </div>
      <div class="auth-msg" id="auth-msg"></div>
      <button class="btn-primary" id="auth-submit" type="submit">登录</button>

    <div class="auth-hint" id="auth-hint">还没有账户？点上面的「创建账户」，输入姓名和密码即可。</div>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="app-view">
  <div class="mobile-top">
    <button class="menu-btn" id="menu-btn" type="button" aria-label="菜单">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="side-brand-name">金小助</div>
      </div>
      <div class="user-chip">
        <div class="avatar" id="avatar">学</div>
        <div style="min-width:0;">
          <div class="user-name" id="side-name">同学</div>
          <div class="user-label">已登录</div>
        </div>
      </div>
      <div class="side-title">学习工具</div>
      <button class="nav-item" data-view="home" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg>

        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
        <span>错题整理</span>
      </button>
      <button class="nav-item" data-view="quiz" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2-2.4 3.8"/><path d="M12 17h.01"/></svg>
        <span>复习自测</span>
      </button>
      <button class="nav-item" data-view="paper" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>

        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 20h20L12 2Z"/><path d="M12 2v9M2 20l10-9 10 9"/><path d="M7 15h10"/></svg>
        <span>学习效果图</span>
      </button>
      <div class="side-foot">
        <button class="logout-btn" id="logout-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
          <span>退出登录</span>
        </button>

    <main class="main" id="main"></main>

<script>
(function () {
  'use strict';

  // ---------- 账户系统（云端 API，跨设备） ----------
  var TOKEN_KEY = 'houkebang_token_v1';
  var Q_KEY = 'houkebang_wrongq_v1'; // { 用户名: [错题] }（错题仍存本地）
  var FREE_KEY = 'houkebang_freechat_v1'; // { 用户名: [对话消息] }（自由问答按账户隔离）
  var API = ''; // 同源：网页和 API 都在 blast-buddies deno.net

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
  function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }
  function api(path, method, body, token) {
    var headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return fetch(API + path, { method: method || 'GET', headers: headers, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json(); });
  }
  // 视觉 AI 是否就绪（后端配了密钥）
  var visionReady = false;
  function checkVision() {
    return api('/api/hk/ai/config', 'GET', null, getToken()).then(function (r) {
      visionReady = !!(r && r.configured); return visionReady;
    }).catch(function () { visionReady = false; return false; });
  }
  // 调用后端视觉 AI（真·看图识别数学题）
  function aiVision(image, prompt) {
    return api('/api/hk/vision', 'POST', { image: image, prompt: prompt }, getToken()).then(function (r) {
      if (!r.ok) throw new Error(r.msg || '视觉 AI 失败');
      return r.text;
    });
  }
  function loadAllQ() { try { return JSON.parse(localStorage.getItem(Q_KEY) || '{}'); } catch (e) { return {}; } }
  function getQ() { var a = loadAllQ(); return a[currentUser] || []; }
  function saveQ(arr) { var a = loadAllQ(); a[currentUser] = arr; localStorage.setItem(Q_KEY, JSON.stringify(a)); }
  // 自由问答：按账户隔离 + 持久化
  function loadAllFree() { try { return JSON.parse(localStorage.getItem(FREE_KEY) || '{}'); } catch (e) { return {}; } }
  function getFreeChat() { var a = loadAllFree(); return a[currentUser] || []; }
  function saveFreeChat(arr) { var a = loadAllFree(); a[currentUser] = arr; localStorage.setItem(FREE_KEY, JSON.stringify(a)); }

  // 学习效果图生成频率（首次登录设置，按用户存本地）
  var FREQ_KEY = 'houkebang_freq_v1'; // { 用户名: 'daily'|'3days'|'weekly'|'monthly' }
  var FREQ_OPTS = [
    { v: 'daily',   label: '每天',   days: 1,  hint: '每天生成一次学习效果图' },
    { v: '3days',   label: '每 3 天', days: 3,  hint: '每 3 天生成一次' },
    { v: 'weekly',  label: '每周',   days: 7,  hint: '每周生成一次' },
    { v: 'monthly', label: '每月',   days: 30, hint: '每月生成一次' }
  ];
  function loadFreq() { try { return JSON.parse(localStorage.getItem(FREQ_KEY) || '{}'); } catch (e) { return {}; } }
  function getFreq() { return loadFreq()[currentUser] || ''; }
  function setFreq(v) { var a = loadFreq(); a[currentUser] = v; localStorage.setItem(FREQ_KEY, JSON.stringify(a)); }
  function freqDays() { var f = getFreq(); for (var i = 0; i < FREQ_OPTS.length; i++) if (FREQ_OPTS[i].v === f) return FREQ_OPTS[i].days; return 1; }

  // 记忆曲线（艾宾浩斯）：间隔天数
  var MEMORY_STEPS = [1, 2, 4, 7, 15, 30];
  var DAY = 24 * 3600 * 1000;
  // 给老错题补 created 字段
  function normalizeQ(arr) {
    var changed = false;
    arr.forEach(function (q) {
      if (!q.created) { q.created = Date.now(); changed = true; }
      if (!q.reviews) { q.reviews = []; changed = true; }
    });
    return changed;
  }
  // 一道错题是否到了复习节点；返回 {due:bool, step:int, days:int}
  function reviewStatus(q) {
    var steps = q.reviewStep || 0; // 已完成的复习阶段数
    if (steps >= MEMORY_STEPS.length) return { due: false, step: steps, days: 0 };
    var last = q.reviews && q.reviews.length ? q.reviews[q.reviews.length - 1] : (q.created || Date.now());
    var need = MEMORY_STEPS[steps] * DAY;
    return { due: Date.now() - last >= need, step: steps, days: MEMORY_STEPS[steps] };
  }
  // 待复习的错题（结合用户设定的生成频率作为最小提醒间隔）
  function dueReviews() {
    var arr = getQ();
    return arr.filter(function (q) { return reviewStatus(q).due; });
  }
  function markReviewed(id, gotIt) {
    var arr = getQ();
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) {
        if (!arr[i].reviews) arr[i].reviews = [];
        arr[i].reviews.push(Date.now());
        // 记住了→推进到下一间隔；没记住→退回起点重新排期
        var step = arr[i].reviewStep || 0;
        if (gotIt === false) arr[i].reviewStep = 0;
        else arr[i].reviewStep = Math.min(MEMORY_STEPS.length, step + 1);
        if (!arr[i].history) arr[i].history = [];
        arr[i].history.push({ t: Date.now(), ok: gotIt !== false });
        if (gotIt === true) arr[i].mastered = true;
        break;
      }
    }
    saveQ(arr);
    logActivity(gotIt === false ? 'review_miss' : 'review_ok');
  }

  // ---------- 学习活动记录（用于趋势/打卡） ----------
  var ACT_KEY = 'houkebang_activity_v1'; // { 用户名: { 'YYYY-MM-DD': {review:int, add:int, ok:int, miss:int} } }
  function todayKey() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function logActivity(kind) {
    var all = {}; try { all = JSON.parse(localStorage.getItem(ACT_KEY) || '{}'); } catch (e) {}
    if (!all[currentUser]) all[currentUser] = {};
    var day = all[currentUser][todayKey()] || { review:0, add:0, ok:0, miss:0 };
    if (kind === 'review_ok') { day.review++; day.ok++; }
    else if (kind === 'review_miss') { day.review++; day.miss++; }
    else if (kind === 'add') day.add++;
    all[currentUser][todayKey()] = day;
    localStorage.setItem(ACT_KEY, JSON.stringify(all));
  }
  function activityStats() {
    var all = {}; try { all = JSON.parse(localStorage.getItem(ACT_KEY) || '{}'); } catch (e) {}
    var mine = all[currentUser] || {}, days = Object.keys(mine).sort();
    var totalReview = 0, totalOk = 0, streak = 0;
    days.forEach(function (d) { totalReview += mine[d].review || 0; totalOk += mine[d].ok || 0; });
    // 连续打卡天数（从今天往前数）
    var cur = new Date();
    for (var i = 0; i < 365; i++) {
      var key = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
      if (mine[key] && (mine[key].review || mine[key].add)) streak++;
      else break;
      cur.setDate(cur.getDate() - 1);
    }
    return { days: days, mine: mine, totalReview: totalReview, totalOk: totalOk, streak: streak,
             rate: totalReview ? Math.round(totalOk / totalReview * 100) : 0 };
  }

  // ---------- 通用弹窗 ----------
  function closeModal() { var m = $('hk-modal'); if (m) m.remove(); }
  function showModal(html) {
    closeModal();
    var mask = document.createElement('div');
    mask.className = 'modal-mask'; mask.id = 'hk-modal';
    mask.innerHTML = '<div class="modal-box">' + html + '</div>';
    mask.addEventListener('click', function (e) { if (e.target === mask) closeModal(); });
    document.body.appendChild(mask);
    return mask;
  }
  function modalIcon(path, color) {
    return '<div class="mi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="' + (color || '#ffd166') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg></div>';
  }

  var $ = function (id) { return document.getElementById(id); };
  var authView = $('auth-view'), appView = $('app-view');
  var form = $('auth-form'), msg = $('auth-msg');
  var nameInput = $('name-input'), passInput = $('pass-input'), confirmInput = $('confirm-input');
  var confirmField = $('confirm-field'), submitBtn = $('auth-submit');
  var tabLogin = $('tab-login'), tabRegister = $('tab-register'), authHint = $('auth-hint');
  var mode = 'login';
  var currentUser = '';

  function setMode(m) {
    mode = m;
    var reg = m === 'register';
    tabLogin.classList.toggle('active', !reg);
    tabRegister.classList.toggle('active', reg);
    confirmField.style.display = reg ? '' : 'none';
    submitBtn.textContent = reg ? '创建账户' : '登录';
    authHint.textContent = reg
      ? '已有账户？点「登录」直接进入。账户保存在云端，任意设备可登录。'
      : '还没有账户？点上面的「创建账户」，输入姓名和密码即可。';
    msg.textContent = ''; msg.className = 'auth-msg';
  }
  tabLogin.addEventListener('click', function () { setMode('login'); });
  tabRegister.addEventListener('click', function () { setMode('register'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    if (!name) { showMsg('请输入姓名', 'err'); return; }
    if (!pass) { showMsg('请输入密码', 'err'); return; }
    if (mode === 'register') {
      if (pass.length < 4) { showMsg('密码至少 4 位', 'err'); return; }
      if (pass !== confirmInput.value) { showMsg('两次密码不一致', 'err'); return; }
    }
    submitBtn.disabled = true;
    showMsg(mode === 'register' ? '正在创建账户…' : '正在登录…', '');

    api(path, 'POST', { name: name, pwd: pass })
      .then(function (r) {
        submitBtn.disabled = false;
        if (!r.ok) { showMsg(r.msg || '操作失败', 'err'); return; }
        setToken(r.token);
        showMsg(mode === 'register' ? '账户创建成功，正在进入…' : '登录成功，正在进入…', 'ok');

  // ---------- AI 调用（免 Key，前端直连 Pollinations） ----------
  function aiAsk(prompt) {
    var url = 'https://text.pollinations.ai/' + encodeURIComponent(prompt);
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('AI 服务暂时不可用 (' + r.status + ')');
      return r.text();
    }).then(function (t) {
      var s = t.replace(/\n{3,}/g, '\n\n').trim();
      // 免费额度限流文本 → 当错误处理，交给上层兜底
      if (/free limit reached|1 reply every|rate.?limit|too many requests/i.test(s)) throw new Error('RATE_LIMIT');
      return s;
    });
  }
  // AI 不可用时的本地兜底：给有用信息，而不是干巴巴道歉
  function localFallback(question) {
    var profile = learningProfile();
    var due = dueReviews().length;
    var tip = '网络有点忙，AI 稍后才能回答（免费接口约每 45 秒可问一次，等一下再发就行）。\n\n';
    if (due) tip += '眼下更值得先做这件事：有 ' + due + ' 道错题到了复习节点，趁现在自测一遍效果最好。\n';
    tip += '你的学情：' + profile + '\n\n也可以点上方「复习自测」先练几题，再来问我。';
    return tip;
  }

  // ---------- AI 学习智能体：人设 + 学情 + 多轮记忆 ----------
  var AGENT_NAME = '金小助';
  var AGENT_PERSONA =
    '你是「' + AGENT_NAME + '」，一位耐心、专业的中小学学习助手。' +
    '你的教学风格：引导式启发，不直接给答案就完事，而是先提示思路、拆解步骤、鼓励思考；' +
    '回答简洁友好、用中文、像身边的老师。遇到不确定的题会诚实说明。';

  // 生成学生当前学情（从本地错题库统计），让 AI 认识这个学生
  function learningProfile() {
    var arr = getQ(), parts = [];
    if (!arr.length) return '该学生还没有记录错题。';
    for (var k in SUBJECTS) {
      var list = arr.filter(function (q) { return (SUBJECTS[q.subject] ? q.subject : 'chinese') === k; });
      if (!list.length) continue;
      var mastered = list.filter(function (q) { return q.mastered; }).length;
      var due = list.filter(function (q) { return reviewStatus(q).due; }).length;
      parts.push(SUBJECTS[k].name + '：错题 ' + list.length + ' 道，已掌握 ' + mastered + ' 道，待复习 ' + due + ' 道');
    }
    return parts.join('；') + '。';
  }

  // 构造带上下文的智能体 prompt：人设 + 学情 + 当前题目 + 历史对话 + 本次问题
  function buildAgentPrompt(question, history, subjectText) {
    var s = AGENT_PERSONA + '\n\n';
    s += '【学生学习情况】' + learningProfile() + '\n';
    if (subjectText) s += '【当前讨论的题目】' + subjectText + '\n';
    if (history && history.length) {
      s += '【之前的对话（请记住并延续）】\n';
      history.slice(-6).forEach(function (h) {
        s += '学生：' + h.q + '\n' + AGENT_NAME + '：' + (h.a || '（未回答）') + '\n';
      });
      s += '\n';
    }
    s += '【学生现在问】' + question + '\n';
    s += '请以' + AGENT_NAME + '的身份回答，结合上面的学情与对话历史，保持连贯，不要重复自我介绍。';
    return s;
  }

  // 处理图片：压缩 → 裁剪框（用户选题目区域）→ OCR
  function handleImage(file) {
    if (ocrBusy) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        // 压缩到最长边 1200，控制本地存储体积
        var maxSide = 1200, scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        window.__fullImage__ = c.toDataURL('image/jpeg', 0.75);
        // 进入裁剪阶段
        $('capture-zone').style.display = 'none';
        $('crop-stage').style.display = 'block';
        $('ocr-stage').style.display = 'none';
        $('crop-img').src = window.__fullImage__;
        initCrop();
      };
      img.onerror = function () { setProgress('图片读取失败', 0); };
      img.src = ev.target.result;
    };
    reader.onerror = function () { setProgress('图片读取失败', 0); };
    reader.readAsDataURL(file);
  }

  // 裁剪框：拖拽移动 + 四角拉伸，用比例存储（相对图片）
  var cropRect = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 };
  function initCrop() {
    cropRect = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 };
    drawCrop();
    var wrap = $('crop-wrap');
    var dragging = null, start = null;
    function pt(e) {
      var r = wrap.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      var cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
      return { x: Math.max(0, Math.min(1, cx / r.width)), y: Math.max(0, Math.min(1, cy / r.height)) };
    }
    function down(e) {
      var p = pt(e);
      // 判断是否点在某个角（就近）
      var corners = [ [cropRect.x,cropRect.y], [cropRect.x+cropRect.w,cropRect.y], [cropRect.x,cropRect.y+cropRect.h], [cropRect.x+cropRect.w,cropRect.y+cropRect.h] ];
      var best = -1, bd = 0.06;
      for (var i=0;i<4;i++){ var d=Math.hypot(p.x-corners[i][0],p.y-corners[i][1]); if(d<bd){bd=d;best=i;} }
      if (best >= 0) dragging = 'c'+best;
      else if (p.x>=cropRect.x && p.x<=cropRect.x+cropRect.w && p.y>=cropRect.y && p.y<=cropRect.y+cropRect.h) dragging='move';
      else { dragging='new'; }
      start = p;
      e.preventDefault();
    }
    function move(e) {
      if (!dragging || !start) return;
      var p = pt(e), dx = p.x-start.x, dy = p.y-start.y;
      if (dragging === 'move') {
        cropRect.x = Math.max(0, Math.min(1-cropRect.w, cropRect.x+dx));
        cropRect.y = Math.max(0, Math.min(1-cropRect.h, cropRect.y+dy));
      } else if (dragging === 'new') {
        cropRect = { x: Math.min(start.x,p.x), y: Math.min(start.y,p.y), w: Math.abs(dx), h: Math.abs(dy) };
      } else {
        var i = parseInt(dragging.charAt(1),10);
        var x0=cropRect.x, y0=cropRect.y, x1=cropRect.x+cropRect.w, y1=cropRect.y+cropRect.h;
        if (i===0){x0=Math.min(p.x,x1-0.05);y0=Math.min(p.y,y1-0.05);}
        if (i===1){x1=Math.max(p.x,x0+0.05);y0=Math.min(p.y,y1-0.05);}
        if (i===2){x0=Math.min(p.x,x1-0.05);y1=Math.max(p.y,y0+0.05);}
        if (i===3){x1=Math.max(p.x,x0+0.05);y1=Math.max(p.y,y0+0.05);}
        cropRect = { x:Math.max(0,x0), y:Math.max(0,y0), w:Math.min(1,x1)-Math.max(0,x0), h:Math.min(1,y1)-Math.max(0,y0) };
      }
      start = p; drawCrop(); e.preventDefault();
    }
    function up() { dragging=null; start=null; }
    wrap.onmousedown=down; wrap.onmousemove=move; window.onmouseup=up;
    wrap.ontouchstart=down; wrap.ontouchmove=move; window.ontouchend=up;
    // 按钮
    $('crop-go').onclick = function () { doCrop(false); };
    $('crop-all').onclick = function () { doCrop(true); };
    $('crop-reset').onclick = function () {
      $('crop-stage').style.display='none'; $('capture-zone').style.display='flex';
      $('q-file').value='';
    };
  }
  function drawCrop() {
    var b = $('crop-box'); if (!b) return;
    b.style.left = (cropRect.x*100)+'%'; b.style.top = (cropRect.y*100)+'%';
    b.style.width = (cropRect.w*100)+'%'; b.style.height = (cropRect.h*100)+'%';
  }
  function doCrop(useAll) {
    // 用新 Image 确保已加载，避免 naturalWidth=0 画出黑图
    var source = new Image();
    source.onload = function () {
      var W = source.naturalWidth, H = source.naturalHeight;
      if (!W || !H) { setProgress('图片未就绪，请重试', 0); return; }
      var c = document.createElement('canvas');
      if (useAll) {
        c.width = W; c.height = H;
        c.getContext('2d').drawImage(source, 0, 0, W, H);
      } else {
        var x = Math.max(0, Math.min(0.95, cropRect.x)) * W;
        var y = Math.max(0, Math.min(0.95, cropRect.y)) * H;
        var w = Math.max(0.03, Math.min(1 - cropRect.x, cropRect.w)) * W;
        var h = Math.max(0.03, Math.min(1 - cropRect.y, cropRect.h)) * H;
        c.width = Math.round(w); c.height = Math.round(h);
        c.getContext('2d').drawImage(source, x, y, w, h, 0, 0, c.width, c.height);
      }
      // 框选太小则放大到最短边≥800px + 白边，保证 AI 看得清
      var MIN_SIDE = 800, PAD = 30;
      if (Math.min(c.width, c.height) < MIN_SIDE) {
        var scale = MIN_SIDE / Math.min(c.width, c.height);
        var nw = Math.round(c.width * scale), nh = Math.round(c.height * scale);
        var big = document.createElement('canvas');
        big.width = nw + PAD*2; big.height = nh + PAD*2;
        var bx = big.getContext('2d');
        bx.fillStyle = '#fff'; bx.fillRect(0,0,big.width,big.height);
        bx.drawImage(c, 0, 0, c.width, c.height, PAD, PAD, nw, nh);
        c = big;
      }
      var dataUrl = c.toDataURL('image/jpeg', 0.9);
      window.__curImage__ = dataUrl;
      $('crop-stage').style.display='none';
      $('ocr-stage').style.display='block';
      $('ocr-preview').src = dataUrl;
      if (visionReady) runVision(dataUrl); else runOCR(dataUrl);
    };
    source.onerror = function () { setProgress('图片加载失败，请重选', 0); };
    source.src = window.__fullImage__ || $('crop-img').src;
  }

  function setProgress(label, pct) {
    var l = $('ocr-label'), f = $('ocr-fill');
    if (l) l.textContent = label;
    if (f) f.style.width = pct + '%';
  }

  // 视觉 AI 直接读图（能看懂数学公式，比 OCR 准）
  function runVision(dataUrl) {
    setProgress('AI 正在看图识别题目…（数学公式也能看懂）', 25);
    aiVision(dataUrl, '请识别这张图片里的题目，判断科目，并给出答案。严格按三行输出，不要多余内容：\n题目：题目文字\n科目：语文或数学或英语\n答案：简洁的答案与步骤')
      .then(function (r) {
        var clean = '（图片题目）', subj = 'chinese', ans = '（AI 未给出答案）';
        var qm = r.match(/题目[：:]\s*([\s\S]*?)\n/); if (qm && qm[1].trim()) clean = qm[1].trim();
        var sm = r.match(/科目[：:]\s*(语文|数学|英语)/); if (sm) subj = sm[1]==='数学'?'math':(sm[1]==='英语'?'english':'chinese');
        var am = r.match(/答案[：:]\s*([\s\S]+)/); if (am) ans = am[1].trim();
        ocrBusy = false;
        addQuestionSilent(clean, ans, subj, dataUrl);
        finishPhoto('已保存到「' + SUBJECTS[subj].name + '」，AI 已看图识别并解答');
      })
      .catch(function () {
        ocrBusy = false;
        setProgress('视觉 AI 暂不可用，改用文字识别…', 30);
        runOCR(dataUrl);
      });
  }

  function runOCR(dataUrl) {
    if (typeof Tesseract === 'undefined') {
      ocrBusy = false;
      finishPhoto('OCR 库未加载，请改用「手动输入」');
      return;
    }
    setProgress('正在识别题目文字…（首次需下载中文包，稍等）', 15);
    Tesseract.recognize(dataUrl, 'chi_sim+eng', {
      logger: function (m) {
        if (m.status === 'recognizing text') setProgress('正在识别题目… ' + Math.round(m.progress * 100) + '%', 15 + Math.round(m.progress * 50));
      }
    }).then(function (res) {
      var raw = (res.data.text || '').replace(/\n{2,}/g, '\n').trim();
      if (!raw) { ocrBusy = false; finishPhoto('没识别到文字，请重拍或改用「手动输入」'); return; }
      setProgress('AI 正在纠错、判科目并解答…', 75);
      // 一次调用完成：纠错 + 判科目 + 解答（省限流、全自动，不用你确认）
      aiAsk('这是一张题目照片，OCR 识别出的原始文字如下（可能有错字，如数学 × 其实是变量 x、0/O 混淆）：\n【' + raw + '】\n' +
        '请纠正识别错误还原题目，判断科目，并给出答案。严格按三行输出（不要多余内容）：\n' +
        '题目：纠正后的题目文字\n科目：语文或数学或英语\n答案：简洁的答案与步骤')
        .then(function (r) {
          var clean = raw, subj = 'chinese', ans = '（AI 暂时无法解答，可稍后在问答里再问）';
          var qm = r.match(/题目[：:]\s*([\s\S]*?)\n/); if (qm && qm[1].trim()) clean = qm[1].trim();
          var sm = r.match(/科目[：:]\s*(语文|数学|英语)/); if (sm) subj = sm[1]==='数学'?'math':(sm[1]==='英语'?'english':'chinese');
          var am = r.match(/答案[：:]\s*([\s\S]+)/); if (am) ans = am[1].trim();
          ocrBusy = false;
          addQuestionSilent(clean, ans, subj, window.__curImage__ || '');
          finishPhoto('已保存到「' + SUBJECTS[subj].name + '」，AI 已自动识别并解答');
        })
        .catch(function () {
          ocrBusy = false;
          addQuestionSilent(raw, '（AI 暂时不可用，稍后可在问答里再问）', 'chinese', window.__curImage__ || '');
          finishPhoto('已保存原始识别结果（AI 暂时忙）');
        });
    }).catch(function (err) {
      ocrBusy = false;
      finishPhoto('识别失败，请重拍或改用「手动输入」');
    });
  }

  // 静默保存一道错题（不依赖表单 DOM）
  function addQuestionSilent(text, answer, subject, image) {
    var arr = getQ();
    arr.unshift({
      id: 'q' + Date.now() + Math.floor(Math.random() * 1000),
      subject: SUBJECTS[subject] ? subject : 'chinese',
      text: text, answer: answer || '',
      image: image || '', chats: [],
      created: Date.now(), reviews: [], reviewStep: 0,
      mastered: false, tries: 0, correct: 0
    });
    saveQ(arr); logActivity('add');
    return arr[0];
  }

  // 拍照流程识别后：AI 后台自动判科目+出答案+保存（不弹确认）
  function commitQuestion(text, answer) {
    var image = window.__curImage__ || '';
    setProgress('AI 正在判断科目并生成答案…', 90);
    aiAsk('判断下面这道题属于语文/数学/英语中的哪一科，并解答它。\n题目：' + text +
      '\n请严格按两行输出（不要多余内容）：\n科目：语文或数学或英语\n答案：简洁的答案与步骤')
      .then(function (r) {
        var subj = 'chinese', ans = r;
        var sm = r.match(/科目[：:]\s*(语文|数学|英语)/);
        if (sm) subj = sm[1]==='数学'?'math':(sm[1]==='英语'?'english':'chinese');
        var am = r.match(/答案[：:]\s*([\s\S]+)/);
        if (am) ans = am[1].trim();
        addQuestionSilent(text, ans, subj, image);
        finishPhoto('已保存（' + SUBJECTS[subj].name + '），AI 已自动出答案');
      })
      .catch(function () {
        addQuestionSilent(text, '（AI 暂时不可用，稍后可在问答里再问）', 'chinese', image);
        finishPhoto('已保存（AI 暂时忙，稍后可再问）');
      });
  }
  function finishPhoto(msgText) {
    $('ocr-stage').style.display = 'none';
    $('crop-stage').style.display = 'none';
    $('capture-zone').style.display = 'flex';
    window.__curImage__ = '';
    setProgress('', 0);
    renderQList();
    qmsg(msgText, 'ok');
  }

  function qmsg(t, c) { var el = $('q-msg'); if (el) { el.textContent = t; el.className = 'inline-msg ' + (c || ''); } }

  // ---------- 试卷导入：拍照试卷/学习单 → AI 拆成多题 → 批量加入错题 ----------
  var paperItems = [];
  function renderPaper(main) {
    main.innerHTML =
      '<div class="welcome"><h1>试卷导入</h1><p>考完试、做完学习单，拍下来，AI 自动拆出每道题并加入错题本。</p></div>' +
      '<div class="card">' +
        '<div class="section-title">上传试卷 / 学习单</div>' +
        '<div class="section-sub">可一次选多张图片。AI 会识别其中的题目、判断科目、给出答案。</div>' +
        '<div class="capture-zone" id="paper-zone">' +
          '<div class="cam-ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffd166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg></div>' +
          '<h3>点这里拍照 / 选试卷图片</h3><p>支持一次选多张，AI 自动拆题</p>' +
          '<input type="file" id="paper-file" accept="image/*" multiple>' +
        '</div>' +
        '<div class="progress-box" id="paper-progress" style="display:none;"><div class="progress-label" id="paper-label">准备中…</div><div class="progress-bar"><div class="progress-fill" id="paper-fill"></div></div></div>' +
        '<div class="inline-msg" id="paper-msg"></div>' +
      '</div>' +
      '<div id="paper-result"></div>';
    $('paper-zone').addEventListener('click', function () { $('paper-file').click(); });
    $('paper-file').addEventListener('change', function (e) {
      var files = Array.prototype.slice.call(e.target.files || []);
      if (files.length) processPaper(files);
    });
    drawPaperResult();
  }
  function processPaper(files) {
    var box = $('paper-progress'); box.style.display = 'block';
    $('paper-label').textContent = '正在识别试卷文字…（首次需下载中文包）'; $('paper-fill').style.width = '10%';
    var chain = Promise.resolve('');
    // 依次 OCR 每张图，拼文字
    files.forEach(function (f, idx) {
      chain = chain.then(function (acc) {
        $('paper-label').textContent = '识别第 ' + (idx+1) + '/' + files.length + ' 张…';
        return new Promise(function (resolve) {
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
              if (typeof Tesseract === 'undefined') { resolve(acc); return; }
              Tesseract.recognize(ev.target.result, 'chi_sim+eng').then(function (res) {
                resolve(acc + '\n' + (res.data.text || ''));
              }).catch(function () { resolve(acc); });
            };
            img.onerror = function () { resolve(acc); };
            img.src = ev.target.result;
          };
          reader.onerror = function () { resolve(acc); };
          reader.readAsDataURL(f);
        });
      });
    });
    chain.then(function (allText) {
      if (!allText.trim()) { $('paper-label').textContent = '没识别到文字'; return; }
      $('paper-label').textContent = 'AI 正在拆分题目并解答…'; $('paper-fill').style.width = '75%';
      return aiAsk('下面是一张试卷/学习单 OCR 识别出的文字。请拆出其中每一道题，判断科目和答案。\n' +
        '只输出 JSON 数组，格式：[{"t":"题目文字","s":"语文|数学|英语","a":"答案"}]\n' +
        '不要输出任何多余文字。\n识别文字：\n' + allText.slice(0, 6000))
        .then(function (r) {
          var arr = [];
          try {
            var m = r.match(/\[[\s\S]*\]/);
            arr = JSON.parse(m ? m[0] : r);
          } catch (e) { arr = []; }
          paperItems = (Array.isArray(arr) ? arr : []).map(function (x) {
            return { t: String(x.t||'').trim(), s: x.s==='数学'?'math':(x.s==='英语'?'english':'chinese'), a: String(x.a||'').trim(), picked: true };
          }).filter(function (x) { return x.t.length > 2; });
          $('paper-progress').style.display = 'none';
          $('paper-msg').textContent = '识别到 ' + paperItems.length + ' 道题，勾选后加入';
          $('paper-msg').className = 'inline-msg ok';
          drawPaperResult();
        });
    }).catch(function () {
      $('paper-label').textContent = '处理失败，请重拍';
    });

  function drawPaperResult() {

    $('paper-add').addEventListener('click', function () {

  var qFilter = 'all';

    var html = '<div class="section-title" style="margin-top:26px;">错题列表 <span style="color:var(--muted);font-size:13px;font-weight:600;">共 ' + all.length + ' 道</span></div>' + tabsHtml;

      html += '<div class="q-item' + (q.mastered ? ' mastered' : '') + '">' +
        '<div class="q-top">' +
          (q.image ? '<img class="q-thumb" src="' + q.image + '" data-act="zoom" data-id="' + q.id + '" alt="题目">' : '') +

        ((q.chats && q.chats.length) ? '<div class="q-ans">已追问 ' + q.chats.length + ' 次</div>' : '') +
      '</div>';
    });
    if (arr.length) html += '</div>';
    wrap.innerHTML = html;
    // 筛选 tab
    var tabs = wrap.querySelectorAll('[data-filter]');
    for (var t = 0; t < tabs.length; t++) {
      tabs[t].addEventListener('click', function () { qFilter = this.getAttribute('data-filter'); renderQList(); });
    }
    var btns = wrap.querySelectorAll('[data-act]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        var id = this.getAttribute('data-id'), act = this.getAttribute('data-act'), arr = getQ();
        if (act === 'ask') { openChatWith(id); return; }
        if (act === 'zoom') {
          var im = null; for (var z = 0; z < arr.length; z++) { if (arr[z].id === id) { im = arr[z].image; break; } }
          if (im) { var w = window.open(); if (w) w.document.write('<title>题目图片</title><body style="margin:0;background:#0d1b2a;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="' + im + '" style="max-width:100%"></body>'); }
          return;
        }
        if (act === 'reviewed') { markReviewed(id); renderQList(); return; }
        if (act === 'del') { arr = arr.filter(function (x) { return x.id !== id; }); }
        else { for (var j = 0; j < arr.length; j++) { if (arr[j].id === id) { arr[j].mastered = !arr[j].mastered; break; } } }
        saveQ(arr); renderQList();

  }

  // ---------- 错题问答（问 AI） ----------
  var activeChatId = ''; // 当前对话关联的错题 id，空=自由提问
  var quizMode = 'test'; // 'test'=复习自测（默认，真正帮学习）, 'chat'=AI问答
  function renderQuiz(main) {

    var tabBtns = main.querySelectorAll('[data-mode]');

  // ---------- 复习自测（主动回忆 + 间隔重复） ----------
  var testQueue = [], testPos = 0, testShowAns = false, testGot = 0, testTotal = 0;
  function renderReviewTest(box) {
    var all = getQ();
    if (!all.length) {
      box.innerHTML = '<div class="card"><div class="empty">还没有错题。先去「错题整理」拍照添加一道，就能开始复习自测了。<br><br><button class="btn gold" id="rt-go" type="button">去添加错题</button></div></div>';
      $('rt-go').addEventListener('click', function () { showView('organize'); }); return;
    }
    // 优先复习到期的题，其次全部题
    if (!testQueue.length || testQueue[0] !== currentUser) {
      var due = dueReviews();
      var pool = due.length ? due : all;
      testQueue = [currentUser].concat(shuffle(pool.map(function (q) { return q.id; })));
      testPos = 0; testGot = 0; testTotal = Math.min(pool.length, 10);
    }
    drawTest(box);
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i+1)), t = a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function drawTest(box) {
    var ids = testQueue.slice(1);
    if (testPos >= ids.length || testPos >= testTotal) {
      box.innerHTML = '<div class="card test-card test-done">' +
        '<div class="big">' + (testTotal ? Math.round(testGot/testTotal*100) : 0) + '%</div>' +
        '<p style="color:var(--muted);margin:12px 0 20px;line-height:1.7;">本轮复习完成：答对 <b style="color:var(--green)">' + testGot + '</b> / ' + testTotal + ' 题。<br>答错的题已回到复习起点，会更快再次出现。</p>' +
        '<div class="quiz-btns" style="justify-content:center;"><button class="btn gold" id="rt-again" type="button">再来一轮</button><button class="btn" id="rt-chart" type="button">看学习效果图</button></div>' +
      '</div>';
      $('rt-again').addEventListener('click', function () { testQueue=[]; renderReviewTest(box); });
      $('rt-chart').addEventListener('click', function () { showView('chart'); });
      return;
    }
    var arr = getQ(), q = null;
    for (var i=0;i<arr.length;i++) if (arr[i].id === ids[testPos]) { q=arr[i]; break; }
    if (!q) { testPos++; drawTest(box); return; }
    var s = SUBJECTS[q.subject] || SUBJECTS.chinese;
    var st = reviewStatus(q);
    box.innerHTML = '<div class="card test-card">' +
      '<div class="test-progress"><span>第 ' + (testPos+1) + ' / ' + testTotal + ' 题</span><div class="bar"><i style="width:' + Math.round(testPos/testTotal*100) + '%"></i></div><span class="subj-tag ' + s.cls + '">' + s.name + '</span></div>' +
      '<div style="font-size:12px;color:var(--muted);">先在心里回忆答案，再点「对照答案」。</div>' +
      '<div class="test-q">' + escapeHtml(q.text) + '</div>' +
      (q.image ? '<img class="preview-img" src="' + q.image + '" alt="题目">' : '') +
      (testShowAns
        ? '<div class="quiz-answer"><b>正确答案：</b>' + (q.answer ? fmtAI(escapeHtml(q.answer)) : '（未填写答案）') + '</div>' +
          '<div class="grade-row"><button class="grade-btn got" id="t-got" type="button">记住了 ✓</button><button class="grade-btn miss" id="t-miss" type="button">还没记住 ✗</button></div>'
        : '<button class="btn gold" id="t-reveal" type="button" style="width:100%;padding:14px;">对照答案</button>') +
      '<div style="font-size:11px;color:var(--muted);margin-top:14px;">记忆曲线：第 ' + (st.step+1) + ' 轮 · ' + (st.days||'已完成') + ' 天间隔</div>' +
    '</div>';
    if (!testShowAns) $('t-reveal').addEventListener('click', function () { testShowAns=true; drawTest(box); });
    else {
      $('t-got').addEventListener('click', function () { markReviewed(q.id, true); testGot++; nextTest(box); });
      $('t-miss').addEventListener('click', function () { markReviewed(q.id, false); nextTest(box); });
    }
  }
  function nextTest(box) { testPos++; testShowAns=false; drawTest(box); }

  // ---------- AI 问答视图 ----------
  function renderChatView(box) {
    var all = getQ();
    var opts = '<option value="">— 自由提问（不关联错题）—</option>';
    all.forEach(function (q) {
      var label = q.text.length > 30 ? q.text.slice(0, 30) + '…' : q.text;

      '<div class="chat-spotlight" id="chat-spotlight" style="display:none;">' +

      showSpotlight(btn.getAttribute('data-label'), '正在生成' + btn.getAttribute('data-label') + '…');
      $('chat-input').value = btn.getAttribute('data-q');

  function showSpotlight(title, body) {

    $('sp-body').textContent = body;

  function closeSpotlight() {

  function getChat() {
    if (!activeChatId) return getFreeChat();
    var arr = getQ();
    for (var i = 0; i < arr.length; i++) { if (arr[i].id === activeChatId) { if (!arr[i].chats) arr[i].chats = []; return arr[i].chats; } }
    return [];
  }
  // 从指定的 arr 里取 chats（保证与 saveQ 用同一份引用）
  function chatsIn(arr) {
    if (!activeChatId) return getFreeChat();
    for (var i = 0; i < arr.length; i++) { if (arr[i].id === activeChatId) { if (!arr[i].chats) arr[i].chats = []; return arr[i].chats; } }
    return [];
  }
  // 保存对话：关联错题存错题库，自由问答存按账户隔离的自由库
  // 必须传入当前正在编辑的 chats 引用，否则 getFreeChat() 重新解析会导致丢失
  function persistChat(arr, chats) {
    if (activeChatId) saveQ(arr);
    else saveFreeChat(chats);
  }
  function loadChat() {
    var box = $('chat-msgs'); if (!box) return;
    var html = '';
    // 需求：错题问答先给答案再问——选中错题时先展示题目与 AI 答案
    if (activeChatId) {
      var arr0 = getQ(), q0 = null;
      for (var i = 0; i < arr0.length; i++) if (arr0[i].id === activeChatId) { q0 = arr0[i]; break; }
      if (q0) {
        html += '<div class="quiz-answer" style="align-self:stretch;margin:0 0 18px;">' +
          '<div style="font-size:12px;font-weight:800;color:var(--accent);margin-bottom:8px;letter-spacing:.5px;">本题 AI 答案</div>' +
          '<div style="font-size:15px;font-weight:700;line-height:1.6;white-space:pre-wrap;word-break:break-word;">' + escapeHtml(q0.text) + '</div>' +
          '<div style="border-top:1px solid rgba(46,196,182,.3);margin-top:12px;padding-top:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word;">' +
            (q0.answer ? fmtAI(escapeHtml(q0.answer)) : '<span style="color:var(--muted)">（还没有答案，可在下面问 AI）</span>') +
          '</div>' +
        '</div>';
      }
    }
    var chats = getChat();
    if (!chats.length) {
      html += '<div class="msg sys">' + (activeChatId ? '这道题的答案在上方，有不懂的地方就继续问我，我会结合刚才的内容回答。' : '你好，我是金小助。想问什么学习问题都可以告诉我，我会一直记得我们聊过的内容。') + '</div>';
      box.innerHTML = html; return;
    }
    chats.forEach(function (c) {
      html += '<div class="msg me">' + escapeHtml(c.q) + '</div>';
      html += '<div class="msg ai">' + fmtAI(escapeHtml(c.a)) + '</div>';
    });
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
  }
  function sendChat() {
    var input = $('chat-input'), text = (input.value || '').trim();
    if (!text) { input.focus(); return; }
    // 若由快捷按钮触发，回答后把内容填入顶部讲解卡
    var activeQuick = document.querySelector('.quick-ask button.active');
    var spotLabel = activeQuick ? activeQuick.getAttribute('data-label') : '';
    if (!spotLabel) closeSpotlight(); // 普通提问：清掉旧的高亮和讲解卡
    var arr = getQ(), ctx = '';
    if (activeChatId) {
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].id === activeChatId) {
          ctx = '题目：' + arr[i].text + (arr[i].answer ? '\n已知答案：' + arr[i].answer : '') + '\n';
          break;
        }
      }
    }
    var chats = chatsIn(arr);
    chats.push({ q: text, a: '' });
    persistChat(arr, chats); // 立即保存（按当前账户隔离）
    input.value = '';
    loadChat();
    var thinking = document.createElement('div');
    thinking.className = 'msg ai thinking'; thinking.textContent = 'AI 正在思考';
    $('chat-msgs').appendChild(thinking);
    $('chat-msgs').scrollTop = $('chat-msgs').scrollHeight;
    var sendBtn = $('chat-send'); sendBtn.disabled = true;
    // 多轮记忆：把本次问题之前的历史传给智能体
    var history = chats.slice(0, -1);
    var subjectText = activeChatId ? ctx.replace(/^题目：/, '').replace(/\n$/, '') : '';
    var prompt = buildAgentPrompt(text, history, subjectText);
    aiAsk(prompt).then(function (ans) {
      chats[chats.length - 1].a = ans;
      persistChat(arr, chats);
      sendBtn.disabled = false;
      loadChat();
      if (spotLabel) showSpotlight(spotLabel, fmtAI(ans));
      // 仅自由提问、且问题较长（像一道题）时，才询问是否加入错题集
      if (!activeChatId && text.length >= 8 && !spotLabel) askAddToBook(text, ans, 'chinese');
    }).catch(function (err) {
      var fb = localFallback(text);
      chats[chats.length - 1].a = fb;
      persistChat(arr, chats);
      sendBtn.disabled = false;
      if (spotLabel) showSpotlight(spotLabel, fb);
      loadChat();
      // 仅在自由提问且问题较长时提示加入错题集（避免连续对话反复弹窗）
      if (!activeChatId && text.length >= 8) askAddToBook(text, '', 'chinese');
    });
  }
  function openChatWith(id) { activeChatId = id; quizMode = 'chat'; showView('quiz'); }

  // 问答后：询问是否加入错题集（可选科目）
  function askAddToBook(question, answer, defaultSubject) {
    var pick = defaultSubject || 'chinese';
    var subjBtns = ['chinese', 'math', 'english'].map(function (k) {
      return '<button type="button" data-pick="' + k + '" class="' + (k === pick ? 'active' : '') + '">' + SUBJECTS[k].name + '</button>';
    }).join('');
    var m = showModal(
      modalIcon('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>', '#2ec4b6') +
      '<div class="modal-title">加入错题集？</div>' +
      '<div class="modal-desc">刚才的问题要不要收进错题本，方便以后按记忆曲线复习？</div>' +
      '<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">选择科目</div>' +
      '<div class="subject-picker">' + subjBtns + '</div>' +
      '<div class="modal-btns"><button class="btn gold" id="addb-yes" type="button">加入错题集</button><button class="btn" id="addb-no" type="button">不用了</button></div>'

    });

  // ---------- 学习效果图（三角形雷达图） ----------
  function computeStats() {
    var arr = getQ(), out = {};
    for (var k in SUBJECTS) out[k] = { total: 0, mastered: 0, tries: 0, correct: 0 };
    arr.forEach(function (q) {
      var k = SUBJECTS[q.subject] ? q.subject : 'chinese';
      out[k].total++;
      if (q.mastered) out[k].mastered++;
      out[k].tries += q.tries || 0;
      out[k].correct += q.correct || 0;
    });
    for (var key in out) {
      var s = out[key];
      // 掌握度：已掌握占比，其次参考问答正确率；无题则 0
      s.score = s.total ? Math.round((s.mastered / s.total) * 100) : 0;
    }
    return out;
  }
  function renderChart(main) {
    var stats = computeStats();
    var act = activityStats();
    var statCards = '<div class="stat-grid">' +
      '<div class="stat-box"><div class="n">' + act.streak + '</div><div class="l">连续学习天数</div></div>' +
      '<div class="stat-box"><div class="n">' + act.totalReview + '</div><div class="l">累计复习次数</div></div>' +
      '<div class="stat-box"><div class="n">' + act.rate + '%</div><div class="l">复习记住率</div></div>' +
      '<div class="stat-box"><div class="n">' + getQ().length + '</div><div class="l">错题总数</div></div>' +
    '</div>';
    // 近7天复习趋势
    var days = [], maxV = 1;
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      var v = (act.mine[key] && act.mine[key].review) || 0;
      if (v > maxV) maxV = v;
      days.push({ label: (d.getMonth()+1)+'/'+d.getDate(), v: v });
    }
    var trend = '<div class="card" style="margin-top:20px;"><div class="section-title">近 7 天复习</div>' +
      '<div class="section-sub">每天复习的题数，坚持就是胜利</div>' +
      '<div class="trend-bars">' + days.map(function (d) {
        return '<div class="col"><div class="b" style="height:' + Math.max(3, Math.round(d.v/maxV*90)) + 'px"></div><div class="d">' + d.label + '</div></div>';
      }).join('') + '</div></div>';
    main.innerHTML = '<div class="welcome"><h1>学习效果图</h1><p>三角形三个顶点分别是语文、数学、英语，离中心越远代表掌握得越好。</p></div>' +
      statCards +
      '<div class="chart-wrap">' +
        '<div class="card chart-box">' + radarSVG(stats) + '</div>' +
        '<div class="card">' +
          '<div class="section-title">各科掌握度</div>' +
          '<div class="section-sub">根据已掌握错题占比计算</div>' +
          statRows(stats) +
        '</div>' +
      '</div>' + trend;
  }
  function statRows(stats) {
    var html = '';
    ['chinese', 'math', 'english'].forEach(function (k) {
      var s = SUBJECTS[k], d = stats[k];
      html += '<div class="stat-row">' +
        '<div class="stat-name"><span class="stat-dot" style="background:' + s.color + '"></span>' + s.name + '</div>' +
        '<div class="stat-num"><span class="score-big" style="color:' + s.color + '">' + d.score + '%</span><br>' +
        d.mastered + '/' + d.total + ' 已掌握 · 答对 ' + d.correct + '/' + d.tries + '</div>' +
      '</div>';
    });
    return html;
  }
  function radarSVG(stats) {
    var cx = 200, cy = 205, R = 140;
    // 三顶点方向：上(语文)、左下(数学)、右下(英语)
    var dirs = [
      { x: 0, y: -1, k: 'chinese' },
      { x: -0.8660, y: 0.5, k: 'math' },
      { x: 0.8660, y: 0.5, k: 'english' }
    ];
    function pt(i, ratio) { return [cx + dirs[i].x * R * ratio, cy + dirs[i].y * R * ratio]; }
    function poly(ratios) {
      return ratios.map(function (r, i) { var p = pt(i, r); return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    }
    var svg = '<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">';
    // 背景网格：25% 50% 75% 100%
    [0.25, 0.5, 0.75, 1].forEach(function (r) {
      svg += '<polygon points="' + poly([r, r, r]) + '" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>';
    });
    // 三条轴线
    dirs.forEach(function (d, i) {
      var p = pt(i, 1);
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="rgba(255,255,255,.12)" stroke-width="1"/>';
    });
    // 数据多边形
    var ratios = dirs.map(function (d) { return Math.max(0, Math.min(1, (stats[d.k].score || 0) / 100)); });
    svg += '<polygon points="' + poly(ratios) + '" fill="rgba(255,209,102,.22)" stroke="#ffd166" stroke-width="2.5" stroke-linejoin="round"/>';
    // 顶点圆点
    dirs.forEach(function (d, i) {
      var p = pt(i, ratios[i]);
      svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="5" fill="#ffd166" stroke="#0d1b2a" stroke-width="1.5"/>';
    });
    // 顶点标签：科目名 + 分数（左右标签向内收，避免贴边被裁）
    dirs.forEach(function (d, i) {
      var lp = pt(i, 1.12), sub = SUBJECTS[d.k];
      var lx = lp[0], anchor;
      if (i === 0) { anchor = 'middle'; }
      else if (i === 1) { lx = Math.max(58, lp[0]); anchor = 'middle'; }
      else { lx = Math.min(342, lp[0]); anchor = 'middle'; }
      var ly = lp[1] + (i === 0 ? 0 : 22);
      svg += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '" fill="' + sub.color + '" font-size="16" font-weight="800" font-family="Segoe UI, Microsoft YaHei, sans-serif">' + sub.name + ' ' + stats[d.k].score + '%</text>';
    });
    svg += '</svg>';
    return svg;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  // 把 AI 返回的 LaTeX 标记转成易读文本
  function fmtAI(s) {
    s = String(s);
    s = s.replace(/\\\[|\\\]|\$\$/g, '');           // 去掉公式定界符
    s = s.replace(/\\\(|\\\)/g, '');                 // 去掉行内定界符
    s = s.replace(/\\Rightarrow|\\to/g, '→');        // 推导箭头
    s = s.replace(/\\times/g, '×').replace(/\\div/g, '÷');
    s = s.replace(/\\dfrac\{([^{}]+)\}\{([^{}]+)\}/g, '$1/$2'); // 分数
    s = s.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '$1/$2');
    s = s.replace(/\\sqrt\{([^{}]+)\}/g, '√($1)');
    s = s.replace(/\\pm/g, '±').replace(/\\cdot/g, '·');
    s = s.replace(/\\left|\\right|\\;|\\,|\\!/g, ''); // 排版命令
    s = s.replace(/\\([a-zA-Z]+)/g, '$1');           // 剩余 \命令 → 命令名
    s = s.replace(/\{|\}/g, '');                      // 残留花括号
    return s;
  }

  // ---------- 侧栏导航 ----------
  var navItems = document.querySelectorAll('.nav-item');
  for (var i = 0; i < navItems.length; i++) {
    navItems[i].addEventListener('click', function () { showView(this.getAttribute('data-view')); });
  }
  var sidebar = $('sidebar'), scrim = $('scrim');
  function openSidebar() { sidebar.classList.add('open'); scrim.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); scrim.classList.remove('show'); }
  $('menu-btn').addEventListener('click', openSidebar);
  scrim.addEventListener('click', closeSidebar);

  // ---------- 会话恢复（向云端验证 token） ----------
  var savedToken = getToken();
  if (savedToken) {
    api('/api/hk/me', 'GET', null, savedToken).then(function (r) {
      if (r.ok && r.name) enterApp(r.name);
      else setToken('');
    }).catch(function () { /* 离线时保持登录页，token 保留下次再试 */ });
  }
})();
</script>
</body>
</html>
