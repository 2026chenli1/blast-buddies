<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>课后帮 · 学习助手</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1b2a; --bg2: #14263c;
    --card: rgba(255,255,255,.06); --border: rgba(255,255,255,.12);
    --text: #eef4ff; --muted: #9fb3c8;
    --accent: #ffd166; --accent2: #ffb703;
    --cyan: #4cc9f0; --green: #2ec4b6; --red: #ff6b6b;
    --pink: #ff6b9d;
  }
  html, body {
    width: 100%; min-height: 100%;
    background: radial-gradient(ellipse at 20% 0%, #1b3350 0%, var(--bg) 55%);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    color: var(--text); -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font-family: inherit; }
  button { cursor: pointer; }
  svg { display: block; }

  /* ============ 登录 / 注册 ============ */
  #auth-view {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; overflow-y: auto;
  }
  .auth-card {
    width: min(420px, 94vw);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border: 1px solid var(--border); border-radius: 20px;
    padding: 34px 28px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45); backdrop-filter: blur(6px);
  }
  .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
  .brand-icon {
    width: 62px; height: 62px; border-radius: 18px;
    background: linear-gradient(145deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(255,183,3,.35); margin-bottom: 14px;
  }
  .brand-title {
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg, #ffd166, #4cc9f0, #2ec4b6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .auth-tab {
    flex: 1; padding: 11px 0; font-size: 15px; font-weight: 800;
    color: var(--muted); background: rgba(255,255,255,.05);
    border: 1px solid var(--border); border-radius: 12px; transition: all .15s ease;
  }
  .auth-tab.active {
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    color: var(--bg); border-color: var(--accent2); box-shadow: 0 4px 16px rgba(255,183,3,.3);
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
  .field input {
    width: 100%; padding: 12px 14px; background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.18); border-radius: 10px;
    color: var(--text); font-size: 15px; outline: none; transition: border-color .15s ease;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: #5f7690; }
  .auth-msg { font-size: 13px; min-height: 18px; margin: 4px 0 10px; line-height: 1.5; }
  .auth-msg.err { color: var(--red); }
  .auth-msg.ok { color: var(--green); }
  .btn-primary {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 800; letter-spacing: 1px;
    color: var(--bg); background: linear-gradient(180deg, var(--accent), var(--accent2));
    border: none; border-radius: 999px;
    box-shadow: 0 5px 0 #d89b00, 0 10px 22px rgba(255,183,3,.3);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #d89b00, 0 14px 28px rgba(255,183,3,.4); }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #d89b00; }
  .auth-hint { text-align: center; font-size: 12px; color: #6c8399; margin-top: 18px; line-height: 1.6; }

  /* ============ 主应用 ============ */
  #app-view { display: none; min-height: 100vh; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; flex: none;
    background: linear-gradient(180deg, #12243a, #0c1928);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 22px 14px;
    position: sticky; top: 0; height: 100vh;
  }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
  .side-brand .brand-icon { width: 40px; height: 40px; border-radius: 12px; margin: 0; }
  .side-brand .brand-icon svg { width: 22px; height: 22px; }
  .side-brand-name { font-size: 17px; font-weight: 900; letter-spacing: 1px; }
  .user-chip {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 24px;
  }
  .avatar {
    width: 36px; height: 36px; flex: none; border-radius: 50%;
    background: linear-gradient(145deg, var(--cyan), var(--green));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; color: var(--bg);
  }
  .user-name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-label { font-size: 11px; color: var(--muted); }
  .side-title { font-size: 11px; color: #6c8399; padding: 0 10px; margin-bottom: 10px; letter-spacing: 1px; font-weight: 700; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 12px; margin-bottom: 6px;
    background: transparent; border: 1px solid transparent; border-radius: 12px;
    color: var(--muted); font-size: 15px; font-weight: 700; text-align: left; transition: all .15s ease;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .nav-item.active { background: rgba(255,209,102,.12); border-color: rgba(255,209,102,.4); color: var(--accent); }
  .nav-item .ico { width: 22px; height: 22px; flex: none; }
  .side-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
  .logout-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px;
    background: rgba(255,107,107,.08); border: 1px solid rgba(255,107,107,.25);
    border-radius: 12px; color: #ff9b9b; font-size: 14px; font-weight: 700;
  }
  .logout-btn:hover { background: rgba(255,107,107,.16); }

  .main { flex: 1; min-width: 0; padding: 34px clamp(18px, 4vw, 52px); }
  .welcome { margin-bottom: 28px; }
  .welcome h1 { font-size: clamp(24px, 3.5vw, 34px); font-weight: 900; letter-spacing: 1px; }
  .welcome p { color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.6; }
  .welcome b { color: var(--accent); }

  /* 首页快捷入口 */
  .quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .quick-card {
    text-align: left; padding: 24px 20px; background: var(--card);
    border: 1px solid var(--border); border-radius: 18px; color: var(--text);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .quick-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.3); box-shadow: 0 14px 30px rgba(0,0,0,.3); }
  .quick-card .panel-ico { margin-bottom: 16px; width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .quick-card h3 { font-size: 18px; font-weight: 800; }
  .quick-card p { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  /* 通用面板 */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px;
  }
  .section-title { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
  .section-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .form-row input, .form-row textarea, .form-row select {
    width: 100%; padding: 11px 12px; background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.18); border-radius: 10px;
    color: var(--text); font-size: 14px; outline: none; resize: vertical;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--accent); }
  .form-row select option { background: var(--bg2); color: var(--text); }
  .btn {
    padding: 11px 20px; font-size: 14px; font-weight: 800;
    border-radius: 10px; border: 1px solid var(--border);
    background: rgba(255,255,255,.08); color: var(--text); transition: all .15s ease;
  }
  .btn:hover { background: rgba(255,255,255,.15); }
  .btn.gold { background: linear-gradient(180deg, var(--accent), var(--accent2)); color: var(--bg); border-color: var(--accent2); }
  .btn.gold:hover { filter: brightness(1.08); }
  .btn.sm { padding: 7px 13px; font-size: 12px; border-radius: 8px; }
  .btn.danger { color: #ff9b9b; border-color: rgba(255,107,107,.3); background: rgba(255,107,107,.08); }
  .btn.danger:hover { background: rgba(255,107,107,.16); }
  .btn.green { color: #7ee0c0; border-color: rgba(46,196,182,.35); background: rgba(46,196,182,.1); }
  .btn.green:hover { background: rgba(46,196,182,.2); }
  .inline-msg { font-size: 13px; min-height: 18px; margin-top: 8px; }
  .inline-msg.err { color: var(--red); }
  .inline-msg.ok { color: var(--green); }

  /* 错题列表 */
  .q-list { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
  .q-item {
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px;
  }
  .q-item.mastered { border-color: rgba(46,196,182,.4); background: rgba(46,196,182,.06); }
  .q-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .subj-tag { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
  .subj-chinese { background: rgba(255,107,157,.16); color: var(--pink); }
  .subj-math { background: rgba(76,201,240,.16); color: var(--cyan); }
  .subj-english { background: rgba(46,196,182,.16); color: var(--green); }
  .master-tag { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: rgba(46,196,182,.18); color: #7ee0c0; }
  .q-actions { margin-left: auto; display: flex; gap: 8px; }
  .q-text { font-size: 15px; font-weight: 600; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .q-ans { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .q-ans b { color: #7ee0c0; }
  .empty {
    text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; line-height: 1.8;
    border: 1px dashed var(--border); border-radius: 14px; margin-top: 20px;
  }

  /* 拍照 / OCR / AI */
  .capture-zone {
    border: 2px dashed rgba(255,209,102,.4); border-radius: 16px;
    padding: 34px 20px; text-align: center; cursor: pointer;
    background: rgba(255,209,102,.04); transition: all .15s ease;
  }
  .capture-zone:hover { background: rgba(255,209,102,.09); border-color: var(--accent); }
  .capture-zone .cam-ico { margin: 0 auto 14px; width: 56px; height: 56px; border-radius: 16px; background: rgba(255,209,102,.15); display: flex; align-items: center; justify-content: center; }
  .capture-zone h3 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
  .capture-zone p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .capture-zone input[type=file] { display: none; }
  .preview-img { max-width: 100%; max-height: 260px; border-radius: 12px; display: block; margin: 14px auto; border: 1px solid var(--border); }
  .progress-box { margin: 14px 0; }
  .progress-bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); width: 0%; transition: width .2s ease; border-radius: 999px; }
  .progress-label { font-size: 13px; color: var(--muted); }
  .result-box { background: rgba(46,196,182,.08); border: 1px solid rgba(46,196,182,.28); border-radius: 12px; padding: 16px; margin-top: 14px; }
  .result-box .lbl { font-size: 12px; font-weight: 800; color: #7ee0c0; margin-bottom: 6px; letter-spacing: .5px; }
  .result-box .val { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .ocr-edit { width: 100%; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; color: var(--text); font-size: 14px; padding: 10px 12px; outline: none; resize: vertical; }
  .ocr-edit:focus { border-color: var(--accent); }
  .q-thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); flex: none; cursor: pointer; }

  /* AI 问答对话 */
  .chat-wrap { max-width: 760px; }
  .chat-select-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .chat-select-row select { flex: 1; min-width: 200px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; color: var(--text); font-size: 14px; padding: 11px 12px; outline: none; }
  .chat-msgs { display: flex; flex-direction: column; gap: 14px; margin: 18px 0; }
  .msg { max-width: 88%; padding: 13px 16px; border-radius: 14px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.me { align-self: flex-end; background: linear-gradient(145deg, #ffd166, #ffb703); color: var(--bg); border-bottom-right-radius: 4px; font-weight: 600; }
  .msg.ai { align-self: flex-start; background: rgba(76,201,240,.1); border: 1px solid rgba(76,201,240,.28); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
  .chat-input-row textarea { flex: 1; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; color: var(--text); font-size: 14px; padding: 12px; outline: none; resize: vertical; min-height: 48px; }
  .chat-input-row textarea:focus { border-color: var(--accent); }
  .quick-ask { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .quick-ask button { font-size: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--border); color: var(--muted); }
  .quick-ask button:hover { color: var(--accent); border-color: rgba(255,209,102,.4); }
  .thinking { color: var(--muted); font-size: 13px; }
  .thinking::after { content: ''; animation: dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'} }

  /* 问答 */
  .quiz-card { max-width: 720px; }
  .quiz-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
  .quiz-q { font-size: 20px; font-weight: 700; line-height: 1.7; margin: 18px 0 26px; white-space: pre-wrap; word-break: break-word; }
  .quiz-answer {
    background: rgba(46,196,182,.1); border: 1px solid rgba(46,196,182,.3);
    border-radius: 12px; padding: 16px; margin-bottom: 22px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  }
  .quiz-answer b { color: #7ee0c0; }
  .quiz-btns { display: flex; gap: 12px; flex-wrap: wrap; }

  /* 效果图雷达图 */
  .chart-wrap { display: grid; grid-template-columns: minmax(300px, 1.2fr) minmax(220px, .8fr); gap: 20px; align-items: start; }
  .chart-box { display: flex; align-items: center; justify-content: center; min-height: 360px; }
  .chart-box svg { width: 100%; max-width: 420px; height: auto; }
  .stat-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-name { display: flex; align-items: center; gap: 9px; font-weight: 700; }
  .stat-dot { width: 10px; height: 10px; border-radius: 50%; }
  .stat-num { color: var(--muted); font-size: 13px; }
  .stat-num b { color: var(--text); font-size: 16px; }
  .score-big { font-size: 30px; font-weight: 900; }

  .mobile-top { display: none; }
  @media (max-width: 720px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 40;
      transform: translateX(-100%); transition: transform .22s ease;
      width: 250px; box-shadow: 8px 0 30px rgba(0,0,0,.5);
    }
    .sidebar.open { transform: translateX(0); }
    .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 35; }
    .scrim.show { display: block; }
    .mobile-top {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      background: linear-gradient(180deg, #12243a, #0c1928);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
    }
    .menu-btn {
      width: 40px; height: 40px; flex: none; background: rgba(255,255,255,.06);
      border: 1px solid var(--border); border-radius: 10px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
    }
    .mobile-top .mt-title { font-size: 16px; font-weight: 900; }
    .main { padding: 24px 16px; }
    .chart-wrap { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ============ 登录 / 注册 ============ -->
<div id="auth-view">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand-title">课后帮</div>
      <div class="brand-sub">你的课后学习小助手</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" type="button">登录</button>
      <button class="auth-tab" id="tab-register" type="button">创建账户</button>
    </div>
    <form id="auth-form" autocomplete="off">
      <div class="field">
        <label for="name-input">姓名</label>
        <input id="name-input" type="text" placeholder="请输入你的姓名" maxlength="20">
      </div>
      <div class="field">
        <label for="pass-input">密码</label>
        <input id="pass-input" type="password" placeholder="请输入密码" maxlength="40">
      </div>
      <div class="field" id="confirm-field" style="display:none;">
        <label for="confirm-input">确认密码</label>
        <input id="confirm-input" type="password" placeholder="再输入一次密码" maxlength="40">
      </div>
      <div class="auth-msg" id="auth-msg"></div>
      <button class="btn-primary" id="auth-submit" type="submit">登录</button>
    </form>
    <div class="auth-hint" id="auth-hint">还没有账户？点上面的「创建账户」，输入姓名和密码即可。</div>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="app-view">
  <div class="mobile-top">
    <button class="menu-btn" id="menu-btn" type="button" aria-label="菜单">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <div class="mt-title">课后帮</div>
  </div>
  <div class="scrim" id="scrim"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="side-brand-name">课后帮</div>
      </div>
      <div class="user-chip">
        <div class="avatar" id="avatar">学</div>
        <div style="min-width:0;">
          <div class="user-name" id="side-name">同学</div>
          <div class="user-label">已登录</div>
        </div>
      </div>
      <div class="side-title">学习工具</div>
      <button class="nav-item" data-view="home" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg>
        <span>首页</span>
      </button>
      <button class="nav-item" data-view="organize" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
        <span>错题整理</span>
      </button>
      <button class="nav-item" data-view="quiz" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2-2.4 3.8"/><path d="M12 17h.01"/></svg>
        <span>错题问答</span>
      </button>
      <button class="nav-item" data-view="chart" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 20h20L12 2Z"/><path d="M12 2v9M2 20l10-9 10 9"/><path d="M7 15h10"/></svg>
        <span>学习效果图</span>
      </button>
      <div class="side-foot">
        <button class="logout-btn" id="logout-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
          <span>退出登录</span>
        </button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- 账户系统（localStorage） ----------
  var USERS_KEY = 'houkebang_users_v1';
  var SESSION_KEY = 'houkebang_session_v1';
  var Q_KEY = 'houkebang_wrongq_v1'; // { 用户名: [错题] }

  function loadUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch (e) { return {}; } }
  function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
  function hash(s) { var h = 0, i; for (i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; } return 'h_' + (h >>> 0).toString(36); }
  function loadAllQ() { try { return JSON.parse(localStorage.getItem(Q_KEY) || '{}'); } catch (e) { return {}; } }
  function getQ() { var a = loadAllQ(); return a[currentUser] || []; }
  function saveQ(arr) { var a = loadAllQ(); a[currentUser] = arr; localStorage.setItem(Q_KEY, JSON.stringify(a)); }

  var $ = function (id) { return document.getElementById(id); };
  var authView = $('auth-view'), appView = $('app-view');
  var form = $('auth-form'), msg = $('auth-msg');
  var nameInput = $('name-input'), passInput = $('pass-input'), confirmInput = $('confirm-input');
  var confirmField = $('confirm-field'), submitBtn = $('auth-submit');
  var tabLogin = $('tab-login'), tabRegister = $('tab-register'), authHint = $('auth-hint');
  var mode = 'login';
  var currentUser = '';

  function setMode(m) {
    mode = m;
    var reg = m === 'register';
    tabLogin.classList.toggle('active', !reg);
    tabRegister.classList.toggle('active', reg);
    confirmField.style.display = reg ? '' : 'none';
    submitBtn.textContent = reg ? '创建账户' : '登录';
    authHint.textContent = reg
      ? '已有账户？点「登录」直接进入。账户保存在本机浏览器。'
      : '还没有账户？点上面的「创建账户」，输入姓名和密码即可。';
    msg.textContent = ''; msg.className = 'auth-msg';
  }
  tabLogin.addEventListener('click', function () { setMode('login'); });
  tabRegister.addEventListener('click', function () { setMode('register'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = nameInput.value.trim(), pass = passInput.value, users = loadUsers();
    if (!name) { showMsg('请输入姓名', 'err'); return; }
    if (!pass) { showMsg('请输入密码', 'err'); return; }
    if (mode === 'register') {
      if (pass.length < 4) { showMsg('密码至少 4 位', 'err'); return; }
      if (pass !== confirmInput.value) { showMsg('两次密码不一致', 'err'); return; }
      if (users[name]) { showMsg('这个名字已被注册，请直接登录', 'err'); return; }
      users[name] = hash(pass); saveUsers(users);
      showMsg('账户创建成功，正在进入…', 'ok');
      setTimeout(function () { enterApp(name); }, 350);
    } else {
      if (!users[name]) { showMsg('没有找到这个账户，请先创建', 'err'); return; }
      if (users[name] !== hash(pass)) { showMsg('密码错误', 'err'); return; }
      showMsg('登录成功，正在进入…', 'ok');
      setTimeout(function () { enterApp(name); }, 250);
    }
  });
  function showMsg(text, cls) { msg.textContent = text; msg.className = 'auth-msg ' + (cls || ''); }

  function enterApp(name) {
    currentUser = name;
    localStorage.setItem(SESSION_KEY, name);
    authView.style.display = 'none';
    appView.style.display = 'block';
    $('side-name').textContent = name;
    $('avatar').textContent = name.charAt(0) || '学';
    passInput.value = ''; confirmInput.value = '';
    showView('home');
  }
  function logout() {
    localStorage.removeItem(SESSION_KEY);
    currentUser = '';
    appView.style.display = 'none';
    authView.style.display = 'flex';
    setMode('login'); nameInput.value = ''; closeSidebar();
  }
  $('logout-btn').addEventListener('click', logout);

  // ---------- 科目（仅用于标记错题 & 雷达图三顶点） ----------
  var SUBJECTS = {
    chinese: { name: '语文', color: '#ff6b9d', cls: 'subj-chinese' },
    math:    { name: '数学', color: '#4cc9f0', cls: 'subj-math' },
    english: { name: '英语', color: '#2ec4b6', cls: 'subj-english' }
  };

  // ---------- 视图路由 ----------
  function showView(view) {
    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', items[i].getAttribute('data-view') === view);
    }
    closeSidebar();
    var main = $('main');
    if (view === 'home') renderHome(main);
    else if (view === 'organize') renderOrganize(main);
    else if (view === 'quiz') renderQuiz(main);
    else if (view === 'chart') renderChart(main);
  }

  function renderHome(main) {
    main.innerHTML =
      '<div class="welcome">' +
        '<h1>你好，<b>' + escapeHtml(currentUser) + '</b></h1>' +
        '<p>整理错题、反复问答，再用效果图看看自己的掌握情况。</p>' +
      '</div>' +
      '<div class="quick-grid">' +
        quickCard('organize', '#ffd166', 'rgba(255,209,102,.14)', 'M4 4h16v16H4z|M8 9h8M8 13h8M8 17h5', '错题整理', '拍照识题，AI 自动给答案') +
        quickCard('quiz', '#4cc9f0', 'rgba(76,201,240,.14)', 'M12 2a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z|M9.5 9a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2-2.4 3.8|M12 17h.01', '错题问答', '选一道题，直接问 AI') +
        quickCard('chart', '#2ec4b6', 'rgba(46,196,182,.14)', 'M12 2 2 20h20L12 2Z|M12 2v9M2 20l10-9 10 9', '学习效果图', '三角形雷达图看三科掌握') +
      '</div>';
    bindQuick();
  }

  function quickCard(view, color, bg, paths, title, desc) {
    var ps = paths.split('|').map(function (d) { return '<path d="' + d + '"/>'; }).join('');
    return '<button class="quick-card" data-go="' + view + '" type="button">' +
      '<div class="panel-ico" style="background:' + bg + '">' +
        '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ps + '</svg>' +
      '</div><h3>' + title + '</h3><p>' + desc + '</p></button>';
  }
  function bindQuick() {
    var cards = document.querySelectorAll('[data-go]');
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener('click', function () { showView(this.getAttribute('data-go')); });
    }
  }

  // ---------- AI 调用（免 Key，前端直连 Pollinations） ----------
  function aiAsk(prompt) {
    var url = 'https://text.pollinations.ai/' + encodeURIComponent(prompt);
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('AI 服务暂时不可用 (' + r.status + ')');
      return r.text();
    }).then(function (t) {
      return t.replace(/\n{3,}/g, '\n\n').trim();
    });
  }

  // ---------- 错题整理（拍照 → OCR 识题 → AI 给答案） ----------
  var ocrBusy = false;
  function renderOrganize(main) {
    var opts = '';
    for (var k in SUBJECTS) { opts += '<option value="' + k + '">' + SUBJECTS[k].name + '</option>'; }
    main.innerHTML =
      '<div class="welcome"><h1>错题整理</h1><p>拍下错题，AI 自动识别题目并给出答案，一起存到本地。</p></div>' +
      '<div class="card">' +
        '<div class="section-title">拍照添加错题</div>' +
        '<div class="section-sub">拍照或从相册选图 → 自动识别题目 → AI 生成答案。</div>' +
        '<div class="capture-zone" id="capture-zone">' +
          '<div class="cam-ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffd166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg></div>' +
          '<h3>点这里拍照 / 上传图片</h3>' +
          '<p>把错题拍清楚，AI 会识别文字并解答<br>图片、题目、答案都会保存在本机</p>' +
          '<input type="file" id="q-file" accept="image/*" capture="environment">' +
        '</div>' +
        '<div id="ocr-stage" style="display:none;">' +
          '<div class="progress-box"><div class="progress-label" id="ocr-label">准备中…</div><div class="progress-bar"><div class="progress-fill" id="ocr-fill"></div></div></div>' +
          '<img id="ocr-preview" class="preview-img" alt="题目图片">' +
          '<div class="form-row" style="margin-top:14px;"><label>识别到的题目（可修改）</label><textarea id="q-text" class="ocr-edit" rows="3" placeholder="识别结果会显示在这里"></textarea></div>' +
          '<div class="form-grid">' +
            '<div class="form-row"><label>科目</label><select id="q-subject">' + opts + '</select></div>' +
            '<div class="form-row"><label>掌握状态</label><select id="q-mastered"><option value="0">未掌握</option><option value="1">已掌握</option></select></div>' +
          '</div>' +
          '<button class="btn gold" id="q-add" type="button" style="display:none;">AI 解答并保存</button>' +
          '<div class="inline-msg" id="q-msg"></div>' +
        '</div>' +
      '</div>' +
      '<div id="q-list-wrap"></div>';

    $('capture-zone').addEventListener('click', function () { $('q-file').click(); });
    $('q-file').addEventListener('change', function (e) {
      var f = e.target.files[0];
      if (f) handleImage(f);
    });
    renderQList();
  }

  // 处理图片：压缩 → 预览 → OCR → 显示编辑框
  function handleImage(file) {
    if (ocrBusy) return;
    ocrBusy = true;
    var stage = $('ocr-stage'); stage.style.display = 'block';
    setProgress('读取图片…', 5);
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        // 压缩到最长边 1200，控制本地存储体积
        var maxSide = 1200, scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var dataUrl = c.toDataURL('image/jpeg', 0.7);
        $('ocr-preview').src = dataUrl;
        window.__curImage__ = dataUrl;
        runOCR(dataUrl);
      };
      img.onerror = function () { ocrBusy = false; setProgress('图片读取失败', 0); };
      img.src = ev.target.result;
    };
    reader.onerror = function () { ocrBusy = false; setProgress('图片读取失败', 0); };
    reader.readAsDataURL(file);
  }

  function setProgress(label, pct) {
    var l = $('ocr-label'), f = $('ocr-fill');
    if (l) l.textContent = label;
    if (f) f.style.width = pct + '%';
  }

  function runOCR(dataUrl) {
    if (typeof Tesseract === 'undefined') {
      // OCR 库没加载（离线等），让用户手输题目
      ocrBusy = false;
      setProgress('OCR 库未加载，请手动输入题目', 100);
      $('q-text').value = '';
      $('q-add').style.display = 'inline-block';
      return;
    }
    setProgress('正在识别题目文字…（首次需下载中文包，稍等）', 15);
    Tesseract.recognize(dataUrl, 'chi_sim+eng', {
      logger: function (m) {
        if (m.status === 'recognizing text') setProgress('正在识别题目… ' + Math.round(m.progress * 100) + '%', 15 + Math.round(m.progress * 60));
      }
    }).then(function (res) {
      var text = (res.data.text || '').replace(/\n{2,}/g, '\n').trim();
      $('q-text').value = text;
      ocrBusy = false;
      setProgress('识别完成，可修改题目后点「AI 解答并保存」', 100);
      $('q-add').style.display = 'inline-block';
      $('q-add').onclick = function () { saveWithAI(text); };
    }).catch(function (err) {
      ocrBusy = false;
      setProgress('识别失败，请手动输入题目', 100);
      $('q-add').style.display = 'inline-block';
      $('q-add').onclick = function () { saveWithAI($('q-text').value.trim()); };
    });
  }

  // AI 生成答案并保存（图片+题目+答案一起存本地）
  function saveWithAI(fallbackText) {
    var text = ($('q-text').value || '').trim() || fallbackText;
    if (!text) { qmsg('请填写或识别题目', 'err'); return; }
    var btn = $('q-add'); btn.disabled = true; btn.textContent = 'AI 正在解答…';
    qmsg('AI 正在生成答案…', '');
    aiAsk('请解答这道题，直接给出答案和简要步骤，用中文回答。题目：' + text + '\n要求：简洁，不要复述题目。')
      .then(function (answer) {
        commitQuestion(text, answer);
      })
      .catch(function (err) {
        // AI 失败也允许保存（答案为空，之后可问 AI）
        commitQuestion(text, '（AI 暂时不可用，可到「错题问答」再问一次）');
      });
  }

  function commitQuestion(text, answer) {
    var arr = getQ();
    arr.unshift({
      id: 'q' + Date.now() + Math.floor(Math.random() * 1000),
      subject: $('q-subject').value,
      text: text, answer: answer,
      image: window.__curImage__ || '',
      chats: [],
      mastered: $('q-mastered').value === '1',
      tries: 0, correct: 0
    });
    saveQ(arr);
    // 重置表单
    $('q-text').value = ''; $('ocr-preview').src = '';
    $('ocr-stage').style.display = 'none';
    $('q-add').style.display = 'none'; $('q-add').disabled = false; $('q-add').textContent = 'AI 解答并保存';
    window.__curImage__ = '';
    setProgress('', 0);
    renderQList();
  }

  function qmsg(t, c) { var el = $('q-msg'); if (el) { el.textContent = t; el.className = 'inline-msg ' + (c || ''); } }
  function renderQList() {
    var wrap = $('q-list-wrap'); if (!wrap) return;
    var arr = getQ();
    if (!arr.length) {
      wrap.innerHTML = '<div class="empty">还没有错题。<br>在上面拍照添加一道，就能开始问答和生成效果图了。</div>';
      return;
    }
    var html = '<div class="section-title" style="margin-top:26px;">错题列表 <span style="color:var(--muted);font-size:13px;font-weight:600;">共 ' + arr.length + ' 道</span></div><div class="q-list">';
    arr.forEach(function (q) {
      var s = SUBJECTS[q.subject] || SUBJECTS.chinese;
      html += '<div class="q-item' + (q.mastered ? ' mastered' : '') + '">' +
        '<div class="q-top">' +
          (q.image ? '<img class="q-thumb" src="' + q.image + '" data-act="zoom" data-id="' + q.id + '" alt="题目">' : '') +
          '<span class="subj-tag ' + s.cls + '">' + s.name + '</span>' +
          (q.mastered ? '<span class="master-tag">已掌握</span>' : '') +
          '<div class="q-actions">' +
            '<button class="btn sm" data-act="ask" data-id="' + q.id + '" type="button">问 AI</button>' +
            '<button class="btn sm ' + (q.mastered ? '' : 'green') + '" data-act="toggle" data-id="' + q.id + '" type="button">' + (q.mastered ? '取消掌握' : '标记掌握') + '</button>' +
            '<button class="btn sm danger" data-act="del" data-id="' + q.id + '" type="button">删除</button>' +
          '</div>' +
        '</div>' +
        '<div class="q-text">' + escapeHtml(q.text) + '</div>' +
        (q.answer ? '<div class="q-ans"><b>AI 答案：</b>' + fmtAI(escapeHtml(q.answer)) + '</div>' : '') +
        ((q.chats && q.chats.length) ? '<div class="q-ans">已追问 ' + q.chats.length + ' 次</div>' : '') +
      '</div>';
    });
    html += '</div>';
    wrap.innerHTML = html;
    var btns = wrap.querySelectorAll('[data-act]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        var id = this.getAttribute('data-id'), act = this.getAttribute('data-act'), arr = getQ();
        if (act === 'ask') { openChatWith(id); return; }
        if (act === 'zoom') {
          var im = null; for (var z = 0; z < arr.length; z++) { if (arr[z].id === id) { im = arr[z].image; break; } }
          if (im) { var w = window.open(); if (w) w.document.write('<title>题目图片</title><body style="margin:0;background:#0d1b2a;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="' + im + '" style="max-width:100%"></body>'); }
          return;
        }
        if (act === 'del') { arr = arr.filter(function (x) { return x.id !== id; }); }
        else { for (var j = 0; j < arr.length; j++) { if (arr[j].id === id) { arr[j].mastered = !arr[j].mastered; break; } } }
        saveQ(arr); renderQList();
      });
    }
  }

  // ---------- 错题问答（问 AI） ----------
  var activeChatId = ''; // 当前对话关联的错题 id，空=自由提问
  function renderQuiz(main) {
    var all = getQ();
    var opts = '<option value="">— 自由提问（不关联错题）—</option>';
    all.forEach(function (q) {
      var label = q.text.length > 30 ? q.text.slice(0, 30) + '…' : q.text;
      opts += '<option value="' + q.id + '"' + (q.id === activeChatId ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
    });
    main.innerHTML =
      '<div class="welcome"><h1>错题问答</h1><p>选一道错题，把不懂的地方直接问 AI；也可以自由提问。</p></div>' +
      '<div class="card chat-wrap">' +
        '<div class="chat-select-row"><label style="font-size:13px;color:var(--muted);font-weight:600;">针对题目：</label><select id="chat-q">' + opts + '</select></div>' +
        '<div class="chat-msgs" id="chat-msgs"></div>' +
        '<div class="chat-input-row">' +
          '<textarea id="chat-input" rows="2" placeholder="输入你的问题，例如：这一步为什么这样算？"></textarea>' +
          '<button class="btn gold" id="chat-send" type="button" style="height:48px;">发送</button>' +
        '</div>' +
        '<div class="quick-ask">' +
          '<button type="button" data-q="请讲解这道题的解法">讲解解法</button>' +
          '<button type="button" data-q="这道题容易错在哪里？">易错点</button>' +
          '<button type="button" data-q="请给我一道类似的练习题">出类似题</button>' +
        '</div>' +
      '</div>';

    var sel = $('chat-q');
    sel.addEventListener('change', function () { activeChatId = sel.value; loadChat(); });
    $('chat-send').addEventListener('click', sendChat);
    $('chat-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
    });
    var quickBtns = document.querySelectorAll('.quick-ask button');
    for (var i = 0; i < quickBtns.length; i++) {
      quickBtns[i].addEventListener('click', function () { $('chat-input').value = this.getAttribute('data-q'); sendChat(); });
    }
    loadChat();
  }

  function getChat() {
    if (!activeChatId) return window.__freeChat__ || (window.__freeChat__ = []);
    var arr = getQ();
    for (var i = 0; i < arr.length; i++) { if (arr[i].id === activeChatId) { if (!arr[i].chats) arr[i].chats = []; return arr[i].chats; } }
    return [];
  }
  // 从指定的 arr 里取 chats（保证与 saveQ 用同一份引用）
  function chatsIn(arr) {
    if (!activeChatId) return window.__freeChat__ || (window.__freeChat__ = []);
    for (var i = 0; i < arr.length; i++) { if (arr[i].id === activeChatId) { if (!arr[i].chats) arr[i].chats = []; return arr[i].chats; } }
    return [];
  }
  function loadChat() {
    var box = $('chat-msgs'); if (!box) return;
    var chats = getChat();
    if (!chats.length) {
      box.innerHTML = '<div class="msg sys">选好题目后，在下面输入问题，AI 会结合这道题为你解答。</div>';
      return;
    }
    var html = '';
    chats.forEach(function (c) {
      html += '<div class="msg me">' + escapeHtml(c.q) + '</div>';
      html += '<div class="msg ai">' + fmtAI(escapeHtml(c.a)) + '</div>';
    });
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
  }
  function sendChat() {
    var input = $('chat-input'), text = (input.value || '').trim();
    if (!text) { input.focus(); return; }
    var arr = getQ(), ctx = '';
    if (activeChatId) {
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].id === activeChatId) {
          ctx = '题目：' + arr[i].text + (arr[i].answer ? '\n已知答案：' + arr[i].answer : '') + '\n';
          break;
        }
      }
    }
    var chats = chatsIn(arr);
    chats.push({ q: text, a: '' });
    input.value = '';
    loadChat();
    var thinking = document.createElement('div');
    thinking.className = 'msg ai thinking'; thinking.textContent = 'AI 正在思考';
    $('chat-msgs').appendChild(thinking);
    $('chat-msgs').scrollTop = $('chat-msgs').scrollHeight;
    var sendBtn = $('chat-send'); sendBtn.disabled = true;
    var prompt = ctx + '学生问：' + text + '\n请用中文简洁友好地解答，像老师讲课一样。';
    aiAsk(prompt).then(function (ans) {
      chats[chats.length - 1].a = ans;
      if (activeChatId) saveQ(arr);
      sendBtn.disabled = false;
      loadChat();
    }).catch(function (err) {
      chats[chats.length - 1].a = '抱歉，AI 暂时不可用，请稍后再试。';
      if (activeChatId) saveQ(arr);
      sendBtn.disabled = false;
      loadChat();
    });
  }
  function openChatWith(id) { activeChatId = id; showView('quiz'); }

  // ---------- 学习效果图（三角形雷达图） ----------
  function computeStats() {
    var arr = getQ(), out = {};
    for (var k in SUBJECTS) out[k] = { total: 0, mastered: 0, tries: 0, correct: 0 };
    arr.forEach(function (q) {
      var k = SUBJECTS[q.subject] ? q.subject : 'chinese';
      out[k].total++;
      if (q.mastered) out[k].mastered++;
      out[k].tries += q.tries || 0;
      out[k].correct += q.correct || 0;
    });
    for (var key in out) {
      var s = out[key];
      // 掌握度：已掌握占比，其次参考问答正确率；无题则 0
      s.score = s.total ? Math.round((s.mastered / s.total) * 100) : 0;
    }
    return out;
  }
  function renderChart(main) {
    var stats = computeStats();
    main.innerHTML = '<div class="welcome"><h1>学习效果图</h1><p>三角形三个顶点分别是语文、数学、英语，离中心越远代表掌握得越好。</p></div>' +
      '<div class="chart-wrap">' +
        '<div class="card chart-box">' + radarSVG(stats) + '</div>' +
        '<div class="card">' +
          '<div class="section-title">各科掌握度</div>' +
          '<div class="section-sub">根据已掌握错题占比计算</div>' +
          statRows(stats) +
        '</div>' +
      '</div>';
  }
  function statRows(stats) {
    var html = '';
    ['chinese', 'math', 'english'].forEach(function (k) {
      var s = SUBJECTS[k], d = stats[k];
      html += '<div class="stat-row">' +
        '<div class="stat-name"><span class="stat-dot" style="background:' + s.color + '"></span>' + s.name + '</div>' +
        '<div class="stat-num"><span class="score-big" style="color:' + s.color + '">' + d.score + '%</span><br>' +
        d.mastered + '/' + d.total + ' 已掌握 · 答对 ' + d.correct + '/' + d.tries + '</div>' +
      '</div>';
    });
    return html;
  }
  function radarSVG(stats) {
    var cx = 200, cy = 205, R = 140;
    // 三顶点方向：上(语文)、左下(数学)、右下(英语)
    var dirs = [
      { x: 0, y: -1, k: 'chinese' },
      { x: -0.8660, y: 0.5, k: 'math' },
      { x: 0.8660, y: 0.5, k: 'english' }
    ];
    function pt(i, ratio) { return [cx + dirs[i].x * R * ratio, cy + dirs[i].y * R * ratio]; }
    function poly(ratios) {
      return ratios.map(function (r, i) { var p = pt(i, r); return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    }
    var svg = '<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">';
    // 背景网格：25% 50% 75% 100%
    [0.25, 0.5, 0.75, 1].forEach(function (r) {
      svg += '<polygon points="' + poly([r, r, r]) + '" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>';
    });
    // 三条轴线
    dirs.forEach(function (d, i) {
      var p = pt(i, 1);
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="rgba(255,255,255,.12)" stroke-width="1"/>';
    });
    // 数据多边形
    var ratios = dirs.map(function (d) { return Math.max(0, Math.min(1, (stats[d.k].score || 0) / 100)); });
    svg += '<polygon points="' + poly(ratios) + '" fill="rgba(255,209,102,.22)" stroke="#ffd166" stroke-width="2.5" stroke-linejoin="round"/>';
    // 顶点圆点
    dirs.forEach(function (d, i) {
      var p = pt(i, ratios[i]);
      svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="5" fill="#ffd166" stroke="#0d1b2a" stroke-width="1.5"/>';
    });
    // 顶点标签：科目名 + 分数（左右标签向内收，避免贴边被裁）
    dirs.forEach(function (d, i) {
      var lp = pt(i, 1.12), sub = SUBJECTS[d.k];
      var lx = lp[0], anchor;
      if (i === 0) { anchor = 'middle'; }
      else if (i === 1) { lx = Math.max(58, lp[0]); anchor = 'middle'; }
      else { lx = Math.min(342, lp[0]); anchor = 'middle'; }
      var ly = lp[1] + (i === 0 ? 0 : 22);
      svg += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '" fill="' + sub.color + '" font-size="16" font-weight="800" font-family="Segoe UI, Microsoft YaHei, sans-serif">' + sub.name + ' ' + stats[d.k].score + '%</text>';
    });
    svg += '</svg>';
    return svg;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  // 把 AI 返回的 LaTeX 标记转成易读文本
  function fmtAI(s) {
    s = String(s);
    s = s.replace(/\\\[|\\\]|\$\$/g, '');           // 去掉公式定界符
    s = s.replace(/\\\(|\\\)/g, '');                 // 去掉行内定界符
    s = s.replace(/\\Rightarrow|\\to/g, '→');        // 推导箭头
    s = s.replace(/\\times/g, '×').replace(/\\div/g, '÷');
    s = s.replace(/\\dfrac\{([^{}]+)\}\{([^{}]+)\}/g, '$1/$2'); // 分数
    s = s.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '$1/$2');
    s = s.replace(/\\sqrt\{([^{}]+)\}/g, '√($1)');
    s = s.replace(/\\pm/g, '±').replace(/\\cdot/g, '·');
    s = s.replace(/\\left|\\right|\\;|\\,|\\!/g, ''); // 排版命令
    s = s.replace(/\\([a-zA-Z]+)/g, '$1');           // 剩余 \命令 → 命令名
    s = s.replace(/\{|\}/g, '');                      // 残留花括号
    return s;
  }

  // ---------- 侧栏导航 ----------
  var navItems = document.querySelectorAll('.nav-item');
  for (var i = 0; i < navItems.length; i++) {
    navItems[i].addEventListener('click', function () { showView(this.getAttribute('data-view')); });
  }
  var sidebar = $('sidebar'), scrim = $('scrim');
  function openSidebar() { sidebar.classList.add('open'); scrim.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); scrim.classList.remove('show'); }
  $('menu-btn').addEventListener('click', openSidebar);
  scrim.addEventListener('click', closeSidebar);

  // ---------- 会话恢复 ----------
  var saved = localStorage.getItem(SESSION_KEY);
  if (saved && loadUsers()[saved]) { enterApp(saved); }
})();
</script>
